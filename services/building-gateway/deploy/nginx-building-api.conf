# Tambahkan di dalam server { ... } iot.get220v.com
location /building-api/ {
    proxy_pass http://127.0.0.1:3011;      # prefix /building-api diteruskan; service menanganinya
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # SSE (/v1/buildings/{id}/stream): jangan buffer, koneksi panjang
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;

    access_log off;
}
