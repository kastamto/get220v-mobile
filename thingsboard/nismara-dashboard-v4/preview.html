<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

#bar b{color:#22d3ee}#bar select,#bar button{background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}

<script>
const HTML="<\!--\n==============================================================================\n  SIAGA-RM / NISMARA  WATER SYSTEM OVERVIEW  v5  (multi-datasource)  by get220v\n  ---------------------------------------------------------------------------\n  Rantai: Rain Water -> GWT (2 tank) -> Transfer Pump -> Roof Tank (booster)\n          + Smart Irrigation (Garden Lt.1 = 2 zone, Garden Roof = 1 zone)\n  ---------------------------------------------------------------------------\n  TB SETUP:\n    Widget type : Time series\n    Datasources : assign 5 device ke SATU widget (urutan bebas, auto-routed by key):\n                  1. GWT        (2 tank + RAIN tank + RAIN flow)\n                  2. Flow transfer pump\n                  3. Roof tank\n                  4. Garden Lt.1  (2 zone)   -> nama device JANGAN mengandung \"roof\"\n                  5. Garden Roof  (1 zone)   -> nama device HARUS mengandung \"roof\"/\"atap\"\n    DataKeys:\n      GWT   : t1_level t1_vol_l t1_dist_cm t2_level t2_vol_l t2_dist_cm\n              balance_diff balance_ok rssi uptime_s heap\n              + RAIN : rw_level rw_vol_l rw_dist_cm rw_flow_lpm rw_total_liters rw_pulses_win\n      FLOW  : flow_lpm total_liters pulses_win pump_running rssi uptime_s heap\n      ROOF  : level_pct level_cm distance_cm volume_l pressure_bar pressure_v\n              pump1_status pump2_status pump1_runtime_s pump2_runtime_s\n              pump1_cycles pump2_cycles tank_count rssi fw_version uptime_s\n      GARDEN LT.1 : z1_soil1 z1_soil2 z1_valve z2_soil1 z2_soil2 z2_valve rssi uptime_s heap\n      GARDEN ROOF : z1_soil1 z1_soil2 z1_valve rssi uptime_s heap\n                    (z*_soil = kelembaban %, z*_valve = 0/1)\n    Time window : >= 24 jam.\n    JS tab      : paste widget.js\n==============================================================================\n-->\n<style>\n.wtr-root{\n  --bg-1:#060b1a; --bg-2:#0a1a2e;\n  --card-bg:rgba(255,255,255,0.035);\n  --card-border:rgba(148,163,184,0.12);\n  --text-1:#f1f5f9; --text-2:#cbd5e1; --text-3:#94a3b8; --text-4:#64748b;\n  --water-1:#06b6d4; --water-2:#0891b2; --water-3:#0e7490;\n  --get220v-accent:#22d3ee;\n  --rain:#2dd4bf; --soil:#34d399;\n  --success:#10b981; --warning:#f59e0b; --danger:#ef4444;\n  --success-soft:rgba(16,185,129,0.15);\n  --warning-soft:rgba(245,158,11,0.15);\n  --danger-soft:rgba(239,68,68,0.15);\n  background:\n    radial-gradient(1000px 500px at 0% 0%, rgba(6,182,212,0.12), transparent),\n    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);\n  color:var(--text-2);\n  font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,system-ui,sans-serif;\n  font-size:13px; line-height:1.5; height:100%; width:100%; min-width:0;\n  border-radius:14px; padding:20px 22px; box-sizing:border-box;\n  overflow-y:auto; overflow-x:hidden;\n}\n.wtr-root *{box-sizing:border-box; min-width:0}\n.wtr-root::-webkit-scrollbar{width:10px}\n.wtr-root::-webkit-scrollbar-thumb{background:rgba(148,163,184,.2);border-radius:5px}\n.wtr-root button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit}\n\n/* HEADER */\n.wtr-hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--card-border)}\n.wtr-hdr-l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n.wtr-logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--water-1),var(--water-3));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}\n.wtr-hdr-title{font-size:18px;font-weight:700;color:var(--text-1);line-height:1.2}\n.wtr-hdr-sub{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:1.2px;margin-top:3px}\n.wtr-brand{font-size:10px;color:var(--get220v-accent);font-weight:700;letter-spacing:1.5px;margin-top:4px;text-transform:uppercase}\n.wtr-hdr-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.wtr-status{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;background:var(--success-soft);border:1px solid rgba(16,185,129,0.3);border-radius:999px;font-size:11px;font-weight:700;color:var(--success);white-space:nowrap}\n.wtr-status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:wtrBlink 2s ease-in-out infinite}\n@keyframes wtrBlink{50%{opacity:0.4}}\n.wtr-status.offline{background:rgba(100,116,139,.15);border-color:rgba(100,116,139,.3);color:var(--text-3)}\n.wtr-status.offline::before{background:var(--text-3);animation:none;box-shadow:none}\n.wtr-status.degraded{background:var(--warning-soft);border-color:rgba(245,158,11,.3);color:var(--warning)}\n.wtr-status.degraded::before{background:var(--warning);box-shadow:0 0 8px var(--warning)}\n.wtr-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(255,255,255,.04);border:1px solid var(--card-border);border-radius:8px;font-size:11px;font-weight:600;color:var(--text-3);white-space:nowrap}\n.wtr-dev-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}\n.wtr-dev-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;background:rgba(255,255,255,.03);border:1px solid var(--card-border);color:var(--text-3)}\n.wtr-dev-chip .led{width:8px;height:8px;border-radius:50%;background:var(--text-4)}\n.wtr-dev-chip.online .led{background:var(--success);box-shadow:0 0 7px var(--success)}\n.wtr-dev-chip.offline{opacity:.6}\n.wtr-dev-chip b{color:var(--text-1)}\n\n/* SUMMARY */\n.wtr-sys-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}\n.wtr-sys-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:13px 15px}\n.wtr-sys-label{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:1px}\n.wtr-sys-value{font-size:22px;font-weight:800;color:var(--text-1);letter-spacing:-0.5px;margin-top:5px;font-variant-numeric:tabular-nums}\n.wtr-sys-value .u{font-size:12px;color:var(--text-3);font-weight:600;margin-left:4px}\n.wtr-sys-foot{font-size:10px;color:var(--text-3);margin-top:4px}\n\n/* SECTIONS */\n.wtr-section{margin-top:22px}\n.wtr-section-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}\n.wtr-section-title{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:1.5px}\n.wtr-panel{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:14px 16px}\n.wtr-schematic{background:rgba(0,0,0,.18);border:1px solid var(--card-border);border-radius:14px;padding:8px}\n.wtr-schematic-svg{width:100%;height:auto;display:block}\n.wtr-flow-pipe{stroke:rgba(148,163,184,.25);stroke-width:6;fill:none;stroke-linecap:round}\n.wtr-flow-pipe.active{stroke:var(--get220v-accent);stroke-dasharray:10 8;animation:wtrFlow 0.9s linear infinite}\n.wtr-flow-pipe.rain.active{stroke:var(--rain)}\n.wtr-flow-pipe.irr.active{stroke:var(--soil)}\n@keyframes wtrFlow{to{stroke-dashoffset:-18}}\n.wtr-spin{transform-box:fill-box;transform-origin:center;animation:wtrSpin 1.1s linear infinite}\n@keyframes wtrSpin{to{transform:rotate(360deg)}}\n\n.wtr-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.wtr-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}\n\n/* TANKS */\n.wtr-tank-card{position:relative;background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center}\n.wtr-tank-card .cap{font-size:11px;font-weight:700;color:var(--text-2);margin-bottom:8px;align-self:flex-start;display:flex;align-items:center;gap:7px}\n.wtr-tank-card .cap .led{width:8px;height:8px;border-radius:50%;background:var(--text-4)}\n.wtr-tank-card.lvl-ok .cap .led{background:var(--success);box-shadow:0 0 7px var(--success)}\n.wtr-tank-card.lvl-warn .cap .led{background:var(--warning);box-shadow:0 0 7px var(--warning)}\n.wtr-tank-card.lvl-low .cap .led{background:var(--danger);box-shadow:0 0 7px var(--danger)}\n.wtr-tank-card.lvl-err .cap .led{background:var(--danger);animation:wtrBlink 1s infinite}\n.wtr-tank-card.lvl-err{border-color:rgba(239,68,68,.35)}\n.wtr-tank-svg{width:100%;max-width:170px;height:auto}\n.wtr-tank-meta{display:flex;justify-content:space-between;width:100%;margin-top:10px;gap:8px}\n.wtr-tank-meta .m{text-align:center;flex:1}\n.wtr-tank-meta .m .v{font-size:14px;font-weight:700;color:var(--text-1);font-variant-numeric:tabular-nums}\n.wtr-tank-meta .m .l{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}\n.wtr-tank-readout{position:absolute;top:42px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}\n.wtr-tank-pct{font-size:26px;font-weight:800;color:var(--text-1);letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}\n.wtr-tank-pct .u{font-size:13px;color:var(--text-3);margin-left:3px;font-weight:600}\n.wtr-tank-err{display:none;margin-top:8px;font-size:10px;font-weight:700;color:var(--danger);background:var(--danger-soft);padding:3px 8px;border-radius:6px}\n.wtr-tank-card.lvl-err .wtr-tank-err{display:block}\n\n.wtr-tank-card.lvl-err .wtr-tank-pct .u{display:none}\n.wtr-tank-card.lvl-err .wtr-tank-pct{font-size:20px;color:var(--danger)}\n\n/* BALANCE */\n.wtr-balance{display:flex;flex-direction:column;justify-content:center;gap:8px}\n.wtr-balance-state{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px}\n.wtr-balance-state.ok{background:var(--success-soft);color:var(--success);border:1px solid rgba(16,185,129,.3)}\n.wtr-balance-state.bad{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(239,68,68,.35)}\n.wtr-balance-state .ic{font-size:18px}\n.wtr-balance-bar{height:10px;border-radius:5px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:4px;position:relative}\n.wtr-balance-bar .center{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(148,163,184,.4)}\n.wtr-balance-bar .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--warning),var(--danger));transition:width .4s}\n.wtr-balance-note{font-size:11px;color:var(--text-3);line-height:1.5}\n\n/* KPI */\n.wtr-kpi-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;min-height:118px}\n.wtr-kpi-card.cyan{background:linear-gradient(135deg,rgba(6,182,212,0.08),rgba(255,255,255,0.035));border-color:rgba(6,182,212,0.2)}\n.wtr-kpi-card.violet{background:linear-gradient(135deg,rgba(167,139,250,0.08),rgba(255,255,255,0.035));border-color:rgba(167,139,250,0.2)}\n.wtr-kpi-card.gold{background:linear-gradient(135deg,rgba(245,158,11,0.06),rgba(255,255,255,0.035));border-color:rgba(245,158,11,0.18)}\n.wtr-kpi-card.rain{background:linear-gradient(135deg,rgba(45,212,191,0.09),rgba(255,255,255,0.035));border-color:rgba(45,212,191,0.25)}\n.wtr-kpi-label{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:1.2px}\n.wtr-kpi-value{font-size:28px;font-weight:800;color:var(--text-1);letter-spacing:-1px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}\n.wtr-kpi-unit{font-size:14px;color:var(--text-3);font-weight:600;margin-left:5px}\n.wtr-kpi-foot{font-size:11px;color:var(--text-3);margin-top:8px}\n.wtr-kpi-bar{height:8px;background:rgba(0,0,0,0.3);border-radius:4px;margin-top:10px;overflow:hidden}\n.wtr-kpi-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--water-1),var(--water-3));transition:width 0.5s ease}\n.wtr-kpi-bar-fill.violet{background:linear-gradient(90deg,#a78bfa,#7c3aed)}\n.wtr-kpi-bar-fill.rain{background:linear-gradient(90deg,#2dd4bf,#0f766e)}\n.wtr-kpi-bar-fill.warn{background:linear-gradient(90deg,var(--warning),#d97706)}\n.wtr-kpi-bar-fill.danger{background:linear-gradient(90deg,var(--danger),#dc2626)}\n.wtr-tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.5px;margin-top:6px}\n.wtr-tag.success{background:var(--success-soft);color:var(--success)}\n.wtr-tag.warning{background:var(--warning-soft);color:var(--warning)}\n.wtr-tag.danger{background:var(--danger-soft);color:var(--danger)}\n.wtr-tag.neutral{background:rgba(148,163,184,.12);color:var(--text-3)}\n\n/* PUMP */\n.wtr-pump-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}\n.wtr-pump-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:all 0.3s}\n.wtr-pump-card.on{background:linear-gradient(135deg,rgba(16,185,129,0.12),rgba(255,255,255,0.035));border-color:rgba(16,185,129,0.35);box-shadow:0 0 18px rgba(16,185,129,0.12)}\n.wtr-pump-l{display:flex;align-items:center;gap:11px;min-width:0;flex:1}\n.wtr-pump-led{width:14px;height:14px;border-radius:50%;background:#475569;flex-shrink:0;transition:all 0.3s}\n.wtr-pump-card.on .wtr-pump-led{background:var(--success);box-shadow:0 0 12px var(--success);animation:wtrBlink 1.5s ease-in-out infinite}\n.wtr-pump-name{font-size:13px;font-weight:700;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.wtr-pump-sub{font-size:10px;color:var(--text-3);margin-top:2px}\n.wtr-pump-r{text-align:right;flex-shrink:0}\n.wtr-pump-r .s{font-size:14px;font-weight:700;color:var(--text-1);font-variant-numeric:tabular-nums}\n.wtr-pump-r .l{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}\n\n/* IRRIGATION ZONES */\n.wtr-zone{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;transition:all .3s}\n.wtr-zone.on{background:linear-gradient(135deg,rgba(52,211,153,0.12),rgba(255,255,255,0.035));border-color:rgba(52,211,153,0.4);box-shadow:0 0 18px rgba(52,211,153,0.12)}\n.wtr-zone.off-line{opacity:.65}\n.zn-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}\n.zn-name{font-size:13px;font-weight:700;color:var(--text-1)}\n.zn-dev{font-size:10px;color:var(--text-3);margin-top:2px}\n.zn-valve{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:700;background:rgba(148,163,184,.12);color:var(--text-3);white-space:nowrap}\n.zn-valve .led{width:9px;height:9px;border-radius:50%;background:#475569}\n.wtr-zone.on .zn-valve{background:var(--success-soft);color:var(--success)}\n.wtr-zone.on .zn-valve .led{background:var(--success);box-shadow:0 0 10px var(--success);animation:wtrBlink 1.2s infinite}\n.zn-main{display:flex;align-items:baseline;gap:6px}\n.zn-pct{font-size:30px;font-weight:800;color:var(--text-1);letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}\n.zn-pct .u{font-size:14px;color:var(--text-3);font-weight:600;margin-left:2px}\n.zn-bar{position:relative;height:10px;border-radius:5px;background:rgba(0,0,0,.3);overflow:visible}\n.zn-bar .fill{height:100%;border-radius:5px;transition:width .5s}\n.zn-bar .fill.ok{background:linear-gradient(90deg,#10b981,#34d399)}\n.zn-bar .fill.dry{background:linear-gradient(90deg,#d97706,#f59e0b)}\n.zn-bar .fill.wet{background:linear-gradient(90deg,#0891b2,#60a5fa)}\n.zn-bar .fill.err{background:#475569}\n.zn-bar .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(241,245,249,.55);border-radius:1px}\n.zn-sensors{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.zn-s{background:rgba(0,0,0,.18);border:1px solid var(--card-border);border-radius:8px;padding:7px 10px}\n.zn-s .l{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;font-weight:600}\n.zn-s .v{font-size:14px;font-weight:700;color:var(--text-1);font-variant-numeric:tab /* KPI with sparkline */\n.kx{--acc:var(--water-1);padding-top:18px}\n.kx::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--acc),transparent)}\n.kx.violet{--acc:#a78bfa}.kx.rain{--acc:var(--rain)}.kx.green{--acc:var(--soil)}.kx.amber{--acc:var(--warning)}\n.kx-l{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.8px;text-transform:uppercase}\n.kx-v{font-size:34px;font-weight:800;letter-spacing:-1.5px;color:var(--text-1);line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}\n.kx-v .u{font-size:13px;color:var(--text-3);font-weight:600;margin-left:4px;letter-spacing:0}\n.kx-f{font-size:11px;color:var(--text-3);margin-top:4px}\n.spark{width:100%;height:44px;display:block;margin-top:8px}\n\n/* HERO rings */\n.hero-body{display:flex;align-items:center;gap:20px;flex-wrap:wrap}\n.hero-ring{position:relative;width:190px;height:190px;flex-shrink:0;margin:0 auto}\n.hero-ring svg{width:100%;height:100%;display:block}\n.hero-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}\n.hero-c .hv{font-size:19px;font-weight:800;color:var(--text-1);letter-spacing:-1px;font-variant-numeric:tabular-nums}\n.hero-c .hl{font-size:9px;color:var(--text-3);letter-spacing:1.2px;font-weight:700;text-transform:uppercase}\n.hero-leg{flex:1;min-width:180px;display:flex;flex-direction:column;gap:9px}\n.lg{display:grid;grid-template-columns:10px 1fr auto;gap:2px 10px;align-items:center;padding:9px 11px;border-radius:12px;background:var(--glass);border:1px solid var(--card-border)}\n.lg i{width:10px;height:10px;border-radius:50%;grid-row:span 2}\n.lg .n{font-size:12px;font-weight:800;color:var(--text-1)}.lg .n small{font-weight:600;color:var(--text-3);margin-left:6px}\n.lg .p{font-size:16px;font-weight:800;color:var(--text-1);text-align:right;font-variant-numeric:tabular-nums}\n.lg .v{font-size:10px;color:var(--text-3)}\n.lg .t{font-size:10px;font-weight:700;color:var(--text-3)}\n.lg .meta{grid-column:2 / span 2;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}\n.lg .n{white-space:nowrap}\n.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:stretch}\n.lg .t.up{color:var(--success)}.lg .t.down{color:var(--warning)}.lg .p.err{color:var(--danger)}\n\n/* ARC gauge cards (water tab) */\n.kp{display:flex;align-items:center;justify-content:space-between;gap:10px}\n.arc{width:128px;flex-shrink:0}\n.arc svg{width:100%;height:auto;display:block}\n.arc-v{fill:var(--text-1);font-size:17px;font-weight:800;font-family:inherit}\n.arc-u{fill:var(--text-3);font-size:8px;font-weight:700;font-family:inherit}\n.arc-m{fill:var(--text-4);font-size:7.5px;font-family:inherit}\n\n/* GARDEN MAP */\n.garden-svg{width:100%;height:auto;display:block;border-radius:12px}\n.wtr-spray{transform-box:fill-box;transform-origin:center;animation:wtrSpray 1.6s ease-out infinite}\n@keyframes wtrSpray{0%{transform:scale(.25);opacity:.85}100%{transform:scale(1.7);opacity:0}}\n.wtr-rip{transform-box:fill-box;transform-origin:center;animation:wtrRip 3.2s ease-out infinite}\n@keyframes wtrRip{0%{transform:scale(.3);opacity:.7}100%{transform:scale(1);opacity:0}}\n.wtr-bub{animation:wtrBub 4.5s linear infinite;opacity:0}\n@keyframes wtrBub{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-70px);opacity:0}}\n.wtr-pulse{animation:wtrBlink 1.2s infinite}\n\n/* TIMELINE */\n.tl-day{font-size:10px;font-weight:800;color:var(--text-4);letter-spacing:1.4px;text-transform:uppercase;margin:12px 0 4px}\n.tl-day:first-child{margin-top:0}\n.tl-item{position:relative;display:grid;grid-template-columns:16px 1fr auto auto;gap:10px;align-items:center;padding:7px 0;font-size:12px}\n.tl-item::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--ring)}\n.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--text-4);border:2px solid var(--bg-2);z-index:1}\n.tl-dot.on{background:var(--success)}.tl-dot.bad{background:var(--danger)}.tl-dot.warn{background:var(--warning)}.tl-dot.rain{background:var(--rain)}\n.tl-tx{font-weight:700;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.tl-tm{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-3)}\n.tl-bd{font-size:9px;font-weight:800;letter-spacing:.6px;padding:2px 7px;border-radius:6px;background:var(--glass)}\n\n/* THEME-AWARE overrides for legacy rules */\n.wtr-live-item,.zn-s,.zn-set,.wtr-kpi-bar,.wtr-chart-svg,.wtr-chart-empty,.wtr-balance-bar,.wtr-date-input input{background:var(--inset)!important}\n.wtr-root[data-theme=\"light\"] .wtr-date-input input{color:var(--text-1)}\n.wtr-root[data-theme=\"light\"] .zn-set input{background:#fff;color:var(--text-1)}\n.wtr-root[data-theme=\"light\"] .wtr-tip,.wtr-root[data-theme=\"light\"] .wtr-toast{background:rgba(255,255,255,.97);color:var(--text-1)}\n.wtr-root[data-theme=\"light\"] .wtr-schematic{background:rgba(255,255,255,.55)}\n.wtr-schematic{background:var(--inset)}\n.wtr-root[data-theme=\"light\"] svg text[fill=\"#cbd5e1\"],.wtr-root[data-theme=\"light\"] svg text[fill=\"#94a3b8\"]{fill:var(--text-2)}\n.wtr-root[data-theme=\"light\"] svg text[fill=\"#64748b\"],.wtr-root[data-theme=\"light\"] svg text[fill=\"#475569\"]{fill:var(--text-3)}\n.wtr-root svg [stroke=\"#0a1a2e\"]{stroke:var(--bg-2)}\n.wtr-root[data-theme=\"light\"] .wtr-zone.on,.wtr-root[data-theme=\"light\"] .wtr-pump-card.on{background:linear-gradient(135deg,rgba(16,185,129,.14),var(--card-bg))}\n.wtr-root[data-theme=\"light\"] .wtr-tab.active,.wtr-root[data-theme=\"light\"] .wtr-preset.active{color:#fff}\n.wtr-tank-card,.wtr-zone,.wtr-kpi-card,.wtr-panel{border-radius:18px;box-shadow:var(--shadow)}\n.wtr-tank-svg{max-width:190px}\n.wtr-tank-readout{top:auto;bottom:112px;text-shadow:0 2px 10px rgba(0,0,0,.45)}\n.wtr-root[data-theme=\"light\"] .wtr-tank-readout{text-shadow:0 1px 6px rgba(255,255,255,.8)}\n\n/* RESPONSIVE (container query -> mengikuti lebar widget, bukan layar) */\n@container wtr (max-width:1050px){.b-3{grid-column:span 6}.b-4,.b-5,.b-7,.b-8{grid-column:span 12}.wtr-3col{grid-template-columns:1fr 1fr}}\n@container wtr (max-width:760px){\n  .wtr-shell{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}\n  .nv{order:2;flex-direction:row;padding:6px 8px;border-right:none;border-top:1px solid var(--card-border);overflow-x:auto;gap:6px;background:var(--card-bg)}\n  .nv-brand,.nv-devs,.nv-foot{display:none}\n  .nv-nav{flex-direction:row;flex:1;justify-content:space-around}\n  .nv-btn{flex-direction:column;gap:2px;padding:6px 10px;font-size:9.5px;position:relative}\n  .nv-btn.active{box-shadow:inset 0 3px 0 var(--water-1)}\n  .nv-btn .bdg{position:absolute;top:2px;right:4px;margin:0;min-width:14px;height:14px;font-size:9px}\n  .mn{padding:14px 12px 18px}\n  .tb-title{font-size:19px}\n  .wtr-2col,.wtr-3col{grid-template-columns:1fr}\n  .b-3{grid-column:span 6}\n}\n@container wtr (max-width:480px){.kgrid{grid-template-columns:1fr}.b-3{grid-column:span 12}.kx-v{font-size:28px}.hero-ring{width:170px;height:170px}}\n</style>\n\n<div class=\"wtr-root\" data-wtr-root data-tab=\"overview\" data-theme=\"dark\">\n<div class=\"wtr-shell\">\n\n  <\!-- ===== SIDEBAR ===== -->\n  <aside class=\"nv\">\n    <div class=\"nv-brand\">\n      <div class=\"wtr-logo\">💧</div>\n      <div><div class=\"nv-title\" data-bind=\"systemName\">Water System</div><div class=\"wtr-brand\">⚡ SIAGA Nextgen · v5</div></div>\n    </div>\n    <nav class=\"nv-nav\" data-tabs-nav role=\"tablist\" aria-label=\"Dashboard sections\">\n      <button class=\"nv-btn active\" data-tab-btn=\"overview\" data-title=\"Overview\"><span class=\"ic\">🗺️</span><span class=\"lb\">Overview</span></button>\n      <button class=\"nv-btn\" data-tab-btn=\"water\" data-title=\"Water System\"><span class=\"ic\">💧</span><span class=\"lb\">Water</span><span class=\"bdg\" data-badge=\"water\"></span></button>\n      <button class=\"nv-btn\" data-tab-btn=\"irrigation\" data-title=\"Smart Irrigation\"><span class=\"ic\">🌱</span><span class=\"lb\">Irrigation</span><span class=\"bdg\" data-badge=\"irrigation\"></span></button>\n      <button class=\"nv-btn\" data-tab-btn=\"analytics\" data-title=\"Analytics\"><span class=\"ic\">📈</span><span class=\"lb\">Analytics</span></button>\n      <button class=\"nv-btn\" data-tab-btn=\"events\" data-title=\"Events\"><span class=\"ic\">🚨</span><span class=\"lb\">Events</span></button>\n    </nav>\n    <div class=\"nv-devs\">\n      <div class=\"nv-devs-t\">Devices</div>\n      <div class=\"wtr-dev-chip\" data-dev-chip=\"gwt\"><span class=\"led\"></span>GWT <b data-bind=\"chipGwt\">--</b></div>\n      <div class=\"wtr-dev-chip\" data-dev-chip=\"flow\"><span class=\"led\"></span>Transfer <b data-bind=\"chipFlow\">--</b></div>\n      <div class=\"wtr-dev-chip\" data-dev-chip=\"roof\"><span class=\"led\"></span>Roof <b data-bind=\"chipRoof\">--</b></div>\n      <div class=\"wtr-dev-chip\" data-dev-chip=\"irrG\"><span class=\"led\"></span>Garden Lt.1 <b data-bind=\"chipIrrG\">--</b></div>\n      <div class=\"wtr-dev-chip\" data-dev-chip=\"irrR\"><span class=\"led\"></span>Garden Roof <b data-bind=\"chipIrrR\">--</b></div>\n    </div>\n    <div class=\"nv-foot\"><button class=\"nv-theme\" data-theme-toggle title=\"Ganti tema terang / gelap\">☀️ Tema terang</button></div>\n  </aside>\n\n  <\!-- ===== MAIN ===== -->\n  <main class=\"mn\" data-main>\n    <header class=\"tb\">\n      <div>\n        <div class=\"tb-title\" data-bind=\"pageTitle\">Overview</div>\n        <div class=\"wtr-hdr-sub\" data-bind=\"systemSub\">Rain → GWT → Transfer → Roof · Smart Irrigation</div>\n      </div>\n      <div class=\"tb-r\">\n        <div class=\"wtr-status\" data-bind=\"status\">● LIVE</div>\n        <div class=\"wtr-chip\" data-age-chip>⏱ <span data-bind=\"updated\">--:--:--</span> <span data-bind=\"age\" style=\"opacity:.7\"></span></div>\n      </div>\n    </header>\n\n    <div class=\"wtr-alerts\" data-alerts aria-live=\"polite\"></div>\n\n    <\!-- ================= OVERVIEW ================= -->\n    <div class=\"bento\" data-tabs=\"overview\">\n      <div class=\"card b-5\">\n        <div class=\"card-t\">🪣 Water Inventory <span class=\"hint\">level tiap sumber</span></div>\n        <div class=\"hero-body\">\n          <div class=\"hero-ring\"><div data-hero-ring></div><div class=\"hero-c\"><div class=\"hv\" data-bind=\"sysStored\">--</div><div class=\"hl\">total stored</div></div></div>\n          <div class=\"hero-leg\" data-hero-leg></div>\n        </div>\n        <div class=\"kx-f\" data-bind=\"sysStoredFoot\" style=\"margin-top:10px\">GWT + Roof + Rain</div>\n      </div>\n      <div class=\"b-7 kgrid\">\n      <div class=\"card kx violet\">\n        <div class=\"kx-l\">🔄 Transfer Flow</div>\n        <div class=\"kx-v\"><span data-bind=\"sysFlow\">--</span><span class=\"u\">L/min</span></div>\n        <div class=\"kx-f\"><span data-bind=\"sysFlowFoot\">pump idle</span> · Σ <b data-bind=\"sysTotalizer\">--</b></div>\n        <svg class=\"spark\" data-spark=\"flow\" viewBox=\"0 0 100 34\" preserveAspectRatio=\"none\"></svg>\n      </div>\n      <div class=\"card kx rain\">\n        <div class=\"kx-l\">🌧️ Rain Collected</div>\n        <div class=\"kx-v\"><span data-bind=\"sysRain\">--</span></div>\n        <div class=\"kx-f\" data-bind=\"sysRainFoot\">rain flow totalizer</div>\n        <svg class=\"spark\" data-spark=\"rain\" viewBox=\"0 0 100 34\" preserveAspectRatio=\"none\"></svg>\n      </div>\n      <div class=\"card kx green\">\n        <div class=\"kx-l\">🌱 Irrigation</div>\n        <div class=\"kx-v\"><span data-bind=\"sysIrrig\">--</span><span class=\"u\">zona aktif</span></div>\n        <div class=\"kx-f\" data-bind=\"sysIrrigFoot\">avg soil --</div>\n        <svg class=\"spark\" data-spark=\"irr\" viewBox=\"0 0 100 34\" preserveAspectRatio=\"none\"></svg>\n      </div>\n      <div cl tle\">🌱 Soil Moisture & Valve Trend</div>\n        <div class=\"wtr-chart-legend\" data-irrig-legend></div>\n      </div>\n      <div class=\"wtr-chartbox\"><svg class=\"wtr-chart-svg irr\" data-chart-irr preserveAspectRatio=\"none\" viewBox=\"0 0 1000 300\" style=\"display:none\"></svg><div class=\"wtr-xline\" data-xline=\"irr\"></div><div class=\"wtr-tip\" data-tip=\"irr\"></div></div>\n      <div class=\"wtr-chart-empty\" data-chart-irr-empty>Belum ada data irigasi. Pastikan device Garden dikirim z*_soil1 / z*_soil2 / z*_valve.</div>\n    </div>\n\n    <\!-- ================= EVENTS ================= -->\n    <div class=\"wtr-section\" data-tabs=\"events water irrigation overview\">\n      <div class=\"wtr-section-hdr\"><div class=\"wtr-section-title\">🚨 System Events <span data-bind=\"eventCount\" style=\"color:var(--text-3);font-weight:500\">[0]</span></div></div>\n      <div class=\"card\"><div data-event-list><div class=\"wtr-event-empty\">No events in selected range.</div></div></div>\n    </div>\n\n    <div class=\"wtr-export\" data-tabs=\"analytics events\">\n      <button class=\"wtr-export-btn\" data-action=\"csv\">📥 CSV</button>\n      <button class=\"wtr-export-btn\" data-action=\"print\">🖨️ Print</button>\n    </div>\n  </main>\n</div>\n<div class=\"wtr-toast-wrap\" data-toast-wrap></div>\n</div>\n", JS="/* ====================================================================\n   SIAGA-RM / NISMARA  WATER SYSTEM OVERVIEW  v4   (multi-datasource)\n   --------------------------------------------------------------------\n   + Rain Water Collection (rw_* keys, ikut device GWT)\n   + Smart Irrigation 3 zone (Garden Lt.1 = 2 zone, Garden Roof = 1 zone)\n   + Sensor-fault aware (ultrasonik dist < 0 => ERR, bukan \"0%\")\n   Routing device = schema-aware (berdasarkan key), bukan nama device,\n   kecuali utk membedakan 2 device irigasi (nama \"roof\"/\"atap\" => Garden Roof).\n   ==================================================================== */\n\n/* ==============  USER DEFAULTS  EDIT BLOCK INI  ============= */\nvar USER_DEFAULTS = {\n  systemName:  'NISMARA Water System',\n  systemSub:   'Rain → GWT → Transfer → Roof · Smart Irrigation',\n\n  /* ---- GWT (2 tank) ---- */\n  gwtT1Label:  'GWT Tank 1',\n  gwtT2Label:  'GWT Tank 2',\n  gwtBalanceWarnPct: 10,\n  gwtT1CapacityL: 2500,\n  gwtT2CapacityL: 2500,\n\n  /* ---- RAIN WATER (device GWT: rw_level rw_vol_l rw_dist_cm rw_flow_lpm rw_total_liters rw_pulses_win) ---- */\n  rwLabel:         'Rain Water Tank',\n  rwCapacityL:     1000,   // <<< SESUAIKAN kapasitas asli tangki hujan (liter)\n  rwFlowMaxLpm:    30,     // skala gauge flow 1 inch\n  rwFlowActiveLpm: 0.5,    // flow >= ini => \"COLLECTING / mengalir\"\n  rwLowPct:        15,     // level di bawah ini => tangki hujan dianggap rendah\n  rwOverflowPct:   95,     // level di atas ini => FULL\n\n  /* ---- TRANSFER ---- */\n  transferLabel:   'Transfer Pump',\n  flowMaxLpm:      40,\n  flowDryRunLpm:   2.0,\n\n  /* ---- ROOF ---- */\n  roofTankCapacityL: 9000,\n  roofTankShape:     'Roof tank · 9 kL',\n  roofTankCount:     4,\n  pressureMaxBar:    5.0,\n  pressureLowBar:    1.0,\n  pressureHighBar:   4.0,\n  pump1Label:        'Booster 1',\n  pump2Label:        'Booster 2',\n  alarmLevelLow:     20,\n  alarmLevelHigh:    95,\n\n  /* ---- SMART IRRIGATION ---- */\n  irrigSource:     'rain',  // 'rain' = prioritas air hujan, fallback GWT bila tangki hujan rendah\n  soilDryPct:      30,      // rata-rata < ini => DRY (perlu siram)\n  soilWetPct:      70,      // rata-rata > ini => WET (skip siram)\n  soilTargetPct:   50,      // target firmware utk stop siram (info)\n  soilMismatchPct: 25,      // selisih 2 sensor dlm 1 zona > ini => warning\n  valveMaxMin:     30,      // valve ON lebih lama dari ini => warning\n  zoneFlowLpm:     6,       // debit default solenoid (L/min) utk estimasi pemakaian air\n  /* role: 'irrG' = Garden Lt.1, 'irrR' = Garden Roof. soil/valve = telemetry key.\n     Override per zona: dry, wet, target, flowLpm */\n  irrigZones: [\n    { id:'g1', role:'irrG', label:'Garden Lt.1 · Zone 1', soil:['z1_soil1','z1_soil2'], valve:'z1_valve', color:'#34d399' },\n    { id:'g2', role:'irrG', label:'Garden Lt.1 · Zone 2', soil:['z2_soil1','z2_soil2'], valve:'z2_valve', color:'#fbbf24' },\n    { id:'r1', role:'irrR', label:'Garden Roof · Zone 1', soil:['z1_soil1','z1_soil2'], valve:'z1_valve', color:'#60a5fa' }\n  ],\n\n  /* ---- WIDGET VIEW / KONTROL ---- */\n  view:          'full',   // 'full' (tab lengkap) | 'water' | 'irrigation'\n  irrigControl:  true,     // tampilkan tombol kontrol irigasi (kirim shared attribute ke device)\n  manualMinutes: [5, 10, 15],\n\n  /* 'level' = volume dihitung dari level% x kapasitas; 'firmware' = pakai *_vol_l mentah */\n  volumeSource: 'level',\n  offlineMs: 90000\n};\n/* ================================================================ */\n\nvar ROLES = ['gwt','flow','roof','irrG','irrR'];\n\nself.onInit = function() {\n  var ctx = self.ctx;\n  var $root = (ctx.$container && ctx.$container[0]) ? ctx.$container[0] : document;\n  var rootEl = $root.querySelector('[data-wtr-root]');\n  if (!rootEl) return;\n\n  var s = ctx.settings || {};\n  ctx.cfg = {};\n  Object.keys(USER_DEFAULTS).forEach(function(k){\n    var v = s[k];\n    ctx.cfg[k] = (v !== undefined && v !== null && v !== '') ? v : USER_DEFAULTS[k];\n  });\n\n  ctx.state = {\n    rootEl: rootEl,\n    dev: newDevs(),\n    range: { preset:'24h', from:new Date(Date.now()-24*3600*1000), to:new Date() },\n    events: []\n  };\n  ctx.$ = function(sel){ return rootEl.querySelector(sel); };\n\n  setText(rootEl, 'systemName', ctx.cfg.systemName);\n  setText(rootEl, 'systemSub',  ctx.cfg.systemSub);\n  setText(rootEl, 'gwtT1Name',  ctx.cfg.gwtT1Label);\n  setText(rootEl, 'gwtT2Name',  ctx.cfg.gwtT2Label);\n  setText(rootEl, 'rwName',     ctx.cfg.rwLabel);\n  setText(rootEl, 'transferName', ctx.cfg.transferLabel);\n  setText(rootEl, 'p1Name',     ctx.cfg.pump1Label);\n  setText(rootEl, 'p2Name',     ctx.cfg.pump2Label);\n  setText(rootEl, 'flowScaleMax', String(Math.round(ctx.cfg.flowMaxLpm)));\n  setText(rootEl, 'rwFlowScaleMax', String(Math.round(ctx.cfg.rwFlowMaxLpm)));\n  setText(rootEl, 'pressScaleMax', String(Math.round(ctx.cfg.pressureMaxBar)));\n\n  var fromEl = rootEl.querySelector('[data-from]');\n  var toEl   = rootEl.querySelector('[data-to]');\n  if (fromEl && toEl) {\n    fromEl.value = isoDt(ctx.state.range.from);\n    toEl.value   = isoDt(ctx.state.range.to);\n    fromEl.addEventListener('change', function(){ var d=new Date(fromEl.value); if(!isNaN(d)){ctx.state.range.from=d; markCustom(rootEl); render();} });\n    toEl.addEventListener('change',   function(){ var d=new Date(toEl.value);   if(!isNaN(d)){ctx.state.range.to=d;   markCustom(rootEl); render();} });\n  }\n  rootEl.querySelectorAll('[data-preset]').forEach(function(btn){\n    btn.addEventListener('click', function(){\n      rootEl.querySelectorAll('[data-preset]').forEach(function(b){ b.classList.remove('active'); });\n      btn.classList.add('active');\n      applyPreset(ctx, btn.getAttribute('data-preset'));\n      var fEl=rootEl.querySelector('[data-from]'), tEl=rootEl.querySelector('[data-to]');\n      if(fEl) fEl.value=isoDt(ctx.state.range.from);\n      if(tEl) tEl.value=isoDt(ctx.state.range.to);\n      render();\n    });\n  });\n\n  // view / tabs\n  ctx.state.ui = { open:{}, edit:{}, pending:{}, alertsAll:false };\n  var view = ctx.cfg.view;\n  if (view==='water' || view==='irrigation'){ rootEl.setAttribute('data-tab', view); rootEl.setAttribute('data-nonav','1'); }\n  rootEl.querySelectorAll('[data-tab-btn]').forEach(function(b){\n    b.setAttribute('role','tab');\n    b.addEventListener('click', function(){\n      rootEl.querySelectorAll('[data-tab-btn]').forEach(function(x){ x.classList.remove('active'); x.setAttribute('aria-selected','false'); });\n      b.classList.add('active'); b.setAttribute('aria-selected','true'); setText(rootEl,'pageTitle', b.getAttribute('data-title')||''); rootEl.setAttribute('data-tab', b.getAttribute('data-tab-btn'));\n      setTimeout(function(){ renderChart(ctx); renderIrrigChart(ctx); }, 0);\n    });\n  });\n  var zwrap = rootEl.querySelector('[data-irrig-zones]');\n  if (zwrap){\n    zwrap.addEventListener('click', function(ev){ onZoneClick(ctx, ev); });\n    zwrap.addEventListener('input', function(ev){\n      var t=ev.target, zEl=t.closest&&t.closest('[data-zone]'); if(!zEl||!t.getAttribute('data-in')) return;\n      var id=zEl.getAttribute('data-zone'); var e=ctx.state.ui.edit[id]||(ctx.state.ui.edit[id]={});\n      e[t.getAttribute('data-in')]=t.value;\n    });\n  }\n\n  // theme (terang/gelap) - disimpan per browser bila diizinkan\n  var theme = (s.theme==='light'||s.theme==='dark') ? s.theme : 'dark';\n  try { var sv = window.localStorage.getItem('nismara_theme'); if (sv==='light'||sv==='dark') theme = sv; } catch(e){}\n  function applyTheme(t){ rootEl.setAttribute('data-theme', t); var tb=rootEl.querySelector('[data-theme-toggle]'); if(tb) tb.textContent = t==='dark' ? '☀️ Tema terang' : '🌙 Tema gelap'; }\n  applyTheme(theme);\n  var tgl = rootEl.querySelector('[data-theme-toggle]');\n  if (tgl) tgl.addEventListener('click', function(){\n    theme = rootEl.getAttribute('data-theme')==='dark' ? 'light' : 'dark'; applyTheme(theme);\n    try { window.localStorage.setItem('nismara_theme', theme); } catch(e){}\n    if (ctx._render) ctx._render();\n  });\n  var gardens = rootEl.querySelectorAll('[data-garden]');\n  gardens.forEach(function(g){ g.addEventListener('click', function(ev){ var z=ev.target.closest('[data-goto]'); if(z) gotoTab(ctx, z.getAttribute('data-goto')); }); });\n  // attention center, schematic click-through, chart hover, freshness timer\n  var alertsEl = rootEl.querySelector('[data-alerts]');\n  if (alertsEl) alertsEl.addEventListener('click', function(ev){\n    var more=ev.target.closest('[data-alerts-more]'); if(more){ ctx.state.ui.alertsAll=!ctx.state.ui.alertsAll; renderAlerts(ctx); return; }\n    var g=ev.target.closest('[data-goto]'); if(g) gotoTab(ctx, g.getAttribute('data-goto'));\n  });\n  var schem = rootEl.querySelector('[data-schematic]');\n  if (schem) schem.addEventListener('click', function(ev){ var g=ev.target.closest('[data-goto]'); if(g) gotoTab(ctx, g.getAttribute('data-goto')); });\n  ctx.state.models = {};\n  attachHover(ctx, 'main', rootEl.querySelector('[data-chart]'));\n  attachHover(ctx, 'irr', rootEl.querySelector('[data-chart-irr]'));\n  ctx.state.timer = setInterval(function(){ updateAge(ctx); }, 1000);\n\n  bindBtn(rootEl, 'csv',   function(){ exportCSV(ctx); });\n  bindBtn(rootEl, 'print', function(){ window.print(); });\n\n  function render() {\n    rebuildDevices(ctx);\n    rebuildEvents(ctx);\n    renderHeader(ctx);\n    renderSummary(ctx);\n    renderSchematic(ctx);\n    renderGWT(ctx);\n    renderRain(ctx);\n    renderTransfer(ctx);\n    renderRoof(ctx);\n    renderIrrigation(ctx);\n    renderTrends(ctx);\n    renderHero(ctx);\n    renderGardenMap(ctx);\n    renderArcs(ctx);\n    renderSparks(ctx);\n    renderAlerts(ctx);\n    renderLive(ctx);\n    renderRangeStats(ctx);\n    renderChart(ctx);\n    renderIrrigChart(ctx);\n    renderEvents(ctx);\n  }\n  ctx._render = render;\n  render();\n};\n\nself.onDataUpdated = function(){ if (self.ctx._render) self.ctx._render(); };\nself.onResize = function(){ if (self.ctx && self.ctx.state) { renderChart(self.ctx); renderIrrigChart(self.ctx); } };\nself.onDestroy = function(){ if (self.ctx && self.ctx.state && self.ctx.state.timer) clearInterval(self.ctx.state.timer); };\n\n/* ============================ DATA LAYER ============================ */\nfunction emptyDev(){ return { latest:{}, series:{}, name:null, lastTs:0, present:false }; }\nfunction newDevs(){ return { gwt:emptyDev(), flow:emptyDev(), roof:emptyDev(), irrG:emptyDev(), irrR:emptyDev(), unknown:emptyDev() }; }\n\nfunction rebuildDevices(ctx) {\n  var data = ctx.data || [];\n  var dev = newDevs();\n\n  var buckets = {};\n  data.forEach(function(d){\n    if (!d || !d.dataKey) return;\n    var ds = d.datasource || {};\n    var id = String(ds.entityId || ds.entityName || ds.name || ('idx_'+(d.datasourceIndex!=null?d.datasourceIndex:0)));\n    if (!buckets[id]) buckets[id] = { keys:{}, name: ds.entityLabel || ds.entityName || ds.name || id, entityId: ds.entityId, entityType: ds.entityType };\n    buckets[id].keys[d.dataKey.name] = d.data || [];\n  });\n\n  Object.keys(buckets).forEach(function(id){\n    var b = buckets[id];\n    var role = classifyRole(b.keys, b.name);\n    var t = dev[role] || dev.unknown;\n    t.present = true; t.name = b.name; t.dsId = id; t.entityId = b.entityId; t.entityType = b.entityType || 'DEVICE';\n    Object.keys(b.keys).forEach(function(key){\n      var series = b.keys[key];\n      t.series[key] = series;\n      if (series && series.length) {\n        var last = series[series.length-1];\n        t.latest[key] = { value: parseFloat(last[1]), raw: last[1], ts: last[0] };\n        if (last[0] > t.lastTs) t.lastTs = last[0];\n      }\n    });\n  });\n  ctx.state.dev = dev;\n}\n\nfunction classifyRole(keys, name) {\n  var n = (name||'').toLowerCase();\n  var kk = Object.keys(keys);\n  if ('t1_level' in keys || 't2_level' in keys || 'balance_diff' in keys || 'balance_ok' in keys ||\n      'rw_level' in keys || 'rw_flow_lpm' in keys || 'rw_total_liters' in keys) return 'gwt';\n  if ('flow_lpm' in keys || 'total_liters' in keys || 'pump_running' in keys || 'pulses_win' in keys) return 'flow';\n  if ('level_pct' in keys || 'pressure_bar' in keys || 'pump1_status' in keys || 'volume_l' in keys) return 'roof';\n  // irrigation by keys (z1_soil1, z2_valve, ...)\n  var hasZ = kk.some(function(k){ return /^z[1-9]_(soil|valve)/.test(k); });\n  var isRoofName = n.indexOf('roof')>=0 || n.indexOf('atap')>=0 || n.indexOf('rooftop')>=0;\n  if (hasZ) {\n    if (isRoofName) return 'irrR';\n    if ('z2_soil1' in keys || 'z2_soil2' in keys || 'z2_valve' in keys) return 'irrG';\n    if (/lt\\.?\\s?1|garden|taman|ground|bawah/.test(n)) return 'irrG';\n    return 'irrR';\n  }\n  if (n.indexOf('gwt')>=0 || n.indexOf('ground')>=0) return 'gwt';\n  if (n.indexOf('flow')>=0 || n.indexOf('transfer')>=0) return 'flow';\n  if (/irrig|garden|taman|soil/.test(n)) return isRoofName ? 'irrR' : 'irrG';\n  if (isRoofName || n.indexOf('booster')>=0) return 'roof';\n  return 'unknown';\n}\n\n/* accessors */\nfunction L(ctx, role, key){ var d=ctx.state.dev[role]; return (d && d.latest[key]) ? d.latest[key] : null; }\nfunction Lv(ctx, role, key){ var x=L(ctx,role,key); return (x && !isNaN(x.value)) ? x.value : null; }\nfunction Lr(ctx, role, key){ var x=L(ctx,role,key); return x ? x.raw : null; }\nfunction S(ctx, role, key){ var d=ctx.state.dev[role]; return (d && d.series[key]) ? d.series[key] : []; }\nfunction devOnline(ctx, role){\n  var d=ctx.state.dev[role];\n  return !!(d && d.present && d.lastTs && (Date.now()-d.lastTs) < ctx.cfg.offlineMs);\n}\nfunction truthy(raw){\n  if (raw===true) return true; if (raw===false || raw==null) return false;\n  var s=String(raw).trim().toLowerCase();\n  return s==='1'||s==='true'||s==='on'||s==='yes'||s==='open'||parseFloat(s)>=1;\n}\n\n/* ---- sensor-fault aware level helpers ----\n   Ultrasonik HC-SR04 gagal baca => firmware kirim dist_cm = -1 dan level = 0.\n   Itu BUKAN tangki kosong; kita tandai ERR dan keluarkan dari total/statistik. */\nfunction tankErr(ctx, role, key, distKey){\n  var v=Lv(ctx,role,key), d=distKey?Lv(ctx,role,distKey):null;\n  return v!=null && d!=null && d<0;\n}\nfunction lvlOf(ctx, role, key, distKey){\n  var v=Lv(ctx,role,key);\n  if (v==null || tankErr(ctx,role,key,distKey)) return null;\n  return v;\n}\nfunction volOf(ctx, role, levelKey, distKey, capCfgKey, fwVolKey){\n  if (tankErr(ctx,role,levelKey,distKey)) return null;\n  if (ctx.cfg.volumeSource === 'level'){\n    var lvl=Lv(ctx,role,levelKey), cap=ctx.cfg[capCfgKey];\n    if (lvl!=null && cap!=null x=\"'+rx+'\" ry=\"'+ry+'\" fill=\"rgba(255,255,255,.06)\" stroke=\"rgba(148,163,184,.6)\" stroke-width=\"1.4\"/>';\n  return s;\n}\nfunction drawTank(ctx, svg, pct, W, H, color){\n  if(!svg) return;\n  svg.innerHTML = cyl(26, 24, 70, 158, pct, color, uid(svg), true);\n}\nfunction drawRoofTank(ctx, svg, pct, N){\n  if(!svg) return;\n  N=Math.max(1,Math.min(N||1,8));\n  var W=280, mX=26, topM=22, h=134, availW=W-mX-12, gap=N>1?10:0;\n  var tankW = Math.min(N===1?150:90, (availW-gap*(N-1))/N);\n  var total=tankW*N+gap*(N-1), x0=mX+(availW-total)/2, id=uid(svg), s='';\n  for (var i=0;i<N;i++) s+=cyl(x0+i*(tankW+gap), topM, tankW, h, pct, '#22d3ee', id+i, i===0);\n  if (N>1){\n    var py=topM+h+24; s+='<line x1=\"'+(x0+tankW/2)+'\" y1=\"'+py+'\" x2=\"'+(x0+total-tankW/2)+'\" y2=\"'+py+'\" stroke=\"rgba(34,211,238,.6)\" stroke-width=\"3\" stroke-linecap=\"round\"/>';\n    for (var k=0;k<N;k++){ var jx=x0+k*(tankW+gap)+tankW/2; s+='<line x1=\"'+jx+'\" y1=\"'+(topM+h+10)+'\" x2=\"'+jx+'\" y2=\"'+py+'\" stroke=\"rgba(34,211,238,.6)\" stroke-width=\"3\"/><text x=\"'+jx+'\" y=\"'+(py+13)+'\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"8\" font-weight=\"700\">T'+(k+1)+'</text>'; }\n  }\n  svg.innerHTML=s;\n}\nfunction uid(el){ if(!el.__uid) el.__uid=Math.random().toString(36).slice(2,7); return el.__uid; }\n\n/* ============================ RENDER: LIVE ============================ */\nfunction renderLive(ctx){\n  var rootEl=ctx.state.rootEl;\n  setText(rootEl,'liveGwt', pctTxt(ctx,'gwt','t1_level','t1_dist_cm',0).replace('%','')+' / '+pctTxt(ctx,'gwt','t2_level','t2_dist_cm',0)+(tankErr(ctx,'gwt','t2_level','t2_dist_cm')?'':'%'));\n  var flow=Lv(ctx,'flow','flow_lpm'); setText(rootEl,'liveFlow', flow==null?'--':flow.toFixed(1));\n  setText(rootEl,'liveRoof', pctTxt(ctx,'roof','level_pct','distance_cm',1));\n  var pr=Lv(ctx,'roof','pressure_bar'); setText(rootEl,'livePress', pr==null?'--':pr.toFixed(2));\n\n  var rl=pctTxt(ctx,'gwt','rw_level','rw_dist_cm',0), rf=Lv(ctx,'gwt','rw_flow_lpm');\n  setText(rootEl,'liveRain', hasRain(ctx) ? (rl+(rl==='ERR'||rl==='--'?'':'%')+' / '+(rf==null?'--':rf.toFixed(1)+' L/m')) : '--');\n\n  var soil=ctx.cfg.irrigZones.map(function(z){ var i=zoneInfo(ctx,z); return i.avg==null?'--':i.avg.toFixed(0); });\n  setText(rootEl,'liveSoil', soil.join(' / ')+'%');\n\n  function r(role){ var v=Lv(ctx,role,'rssi'); return v==null?'-':Math.round(v); }\n  setText(rootEl,'liveRssi', r('gwt')+'/'+r('flow')+'/'+r('roof')+'/'+r('irrG')+'/'+r('irrR'));\n  var ups=ROLES.map(function(x){return Lv(ctx,x,'uptime_s');}).filter(function(x){return x!=null;});\n  setText(rootEl,'liveUptime', ups.length?formatUptime(Math.min.apply(null,ups)):'--');\n  function h(role){ var v=Lv(ctx,role,'heap'); return v==null?'-':Math.round(v/1024)+'k'; }\n  setText(rootEl,'liveHeap', h('gwt')+'/'+h('irrG')+'/'+h('irrR'));\n}\n\n/* ============================ RANGE STATS ============================ */\nfunction renderRangeStats(ctx){\n  var rootEl=ctx.state.rootEl;\n  var g1=vSeries(ctx,'gwt','t1_level','t1_dist_cm'), g2=vSeries(ctx,'gwt','t2_level','t2_dist_cm');\n  var rr=vSeries(ctx,'roof','level_pct','distance_cm'), rw=vSeries(ctx,'gwt','rw_level','rw_dist_cm');\n  var n=Math.max(S(ctx,'gwt','t1_level').length, S(ctx,'roof','level_pct').length, S(ctx,'flow','flow_lpm').length, S(ctx,'gwt','rw_level').length);\n  setText(rootEl,'rangeSamples', n||'--');\n  setText(rootEl,'rangeGwt', stat3([].concat(numVals(g1),numVals(g2)),'%',1));\n  setText(rootEl,'rangeRoof', stat3(numVals(rr),'%',1));\n  setText(rootEl,'rangeRain', stat3(numVals(rw),'%',1));\n  setText(rootEl,'rangeFlow', stat3(numVals(S(ctx,'flow','flow_lpm')),'L/min',1));\n\n  var fromTs=ctx.state.range.from.getTime(), toTs=ctx.state.range.to.getTime();\n  setText(rootEl,'rangeTransferred', deltaOf(S(ctx,'flow','total_liters'),fromTs,toTs));\n  setText(rootEl,'rangeRainCollected', deltaOf(S(ctx,'gwt','rw_total_liters'),fromTs,toTs));\n}\nfunction deltaOf(series, fromTs, toTs){\n  var ser=series.filter(function(p){return p[0]>=fromTs&&p[0]<=toTs;});\n  if (ser.length<2) return '--';\n  var vals=numVals(ser); if (vals.length<2) return '--';\n  return formatVol(Math.max.apply(null,vals)-Math.min.apply(null,vals));\n}\nfunction numVals(series){ return series.map(function(p){return parseFloat(p[1]);}).filter(function(x){return !isNaN(x);}); }\nfunction stat3(vals, unit, dp){\n  if(!vals.length) return '--';\n  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);\n  var av=vals.reduce(function(a,b){return a+b;},0)/vals.length;\n  return mn.toFixed(dp)+' / '+av.toFixed(dp)+' / '+mx.toFixed(dp)+' '+unit;\n}\n\n/* ============================ CHART: LEVELS & FLOW ============================ */\nfunction renderChart(ctx){\n  var svg=ctx.$('[data-chart]'); var emptyEl=ctx.$('[data-chart-empty]'); if(!svg) return;\n\n  var sT1=vSeries(ctx,'gwt','t1_level','t1_dist_cm'), sT2=vSeries(ctx,'gwt','t2_level','t2_dist_cm');\n  var sRoof=vSeries(ctx,'roof','level_pct','distance_cm'), sRain=vSeries(ctx,'gwt','rw_level','rw_dist_cm');\n  var sFlow=S(ctx,'flow','flow_lpm'), sRF=S(ctx,'gwt','rw_flow_lpm');\n  var sPump=S(ctx,'flow','pump_running');\n\n  var allTs=[];\n  [sT1,sT2,sRoof,sRain,sFlow,sRF].forEach(function(ser){ ser.forEach(function(p){allTs.push(p[0]);}); });\n  if (allTs.length<2){ svg.style.display='none'; ctx.state.models.main=null; if(emptyEl){emptyEl.style.display='flex';} return; }\n  svg.style.display=''; if(emptyEl) emptyEl.style.display='none';\n\n  var fromTs=Math.min.apply(null,allTs), toTs=Math.max.apply(null,allTs), spanMs=Math.max(1,toTs-fromTs);\n  var W=1000,H=280,padL=52,padR=58,padT=22,padB=30, cW=W-padL-padR, cH=H-padT-padB;\n  function xOf(ts){ return padL+((ts-fromTs)/spanMs)*cW; }\n  function yLvl(v){ return padT+cH-(v/100)*cH; }\n  var flowMax=Math.max(ctx.cfg.flowMaxLpm, 1);\n  var fv=numVals(sFlow).concat(numVals(sRF));\n  if (fv.length){ var fm=Math.max.apply(null,fv); if(fm>flowMax) flowMax=Math.ceil(fm/5)*5; on applyPreset(ctx,p){ var now=new Date();\n  switch(p){\n    case '6h':  ctx.state.range.from=new Date(now.getTime()-6*3600000); break;\n    case '24h': ctx.state.range.from=new Date(now.getTime()-24*3600000); break;\n    case '7d':  ctx.state.range.from=new Date(now.getTime()-7*86400000); break;\n    case '30d': ctx.state.range.from=new Date(now.getTime()-30*86400000); break;\n    case 'custom': return;\n  }\n  ctx.state.range.to=now; ctx.state.range.preset=p;\n}\nfunction markCustom(rootEl){ rootEl.querySelectorAll('[data-preset]').forEach(function(b){b.classList.remove('active');}); var c=rootEl.querySelector('[data-preset=\"custom\"]'); if(c) c.classList.add('active'); }\nfunction setText(rootEl,key,val){ var el=rootEl.querySelector('[data-bind=\"'+key+'\"]'); if(el) el.textContent=val; }\nfunction pad2(n){ return (n<10?'0':'')+n; }\nfunction isoDt(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes()); }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }\nfunction formatVol(LL){ if(LL==null||isNaN(LL)) return '-- L'; if(LL>=1000) return (LL/1000).toFixed(2)+' kL'; return LL.toFixed(0)+' L'; }\nfunction formatRuntime(sec){ if(sec==null||isNaN(sec)) return '--'; var s=Math.floor(sec),h=Math.floor(s/3600),m=Math.floor((s%3600)/60); if(h>=1) return h+'h '+(m<10?'0':'')+m+'m'; return m+'m '+(s%60)+'s'; }\nfunction formatUptime(sec){ sec=Math.round(sec); var d=Math.floor(sec/86400),h=Math.floor((sec%86400)/3600),m=Math.floor((sec%3600)/60); if(d>0) return d+'d '+h+'h'; if(h>0) return h+'h '+m+'m'; return m+'m '+(sec%60)+'s'; }\nfunction toast(ctx,msg,type){ var wrap=ctx.$('[data-toast-wrap]'); if(!wrap) return; var t=document.createElement('div'); t.className='wtr-toast '+(type||''); t.textContent=msg; wrap.appendChild(t);\n  setTimeout(function(){ t.style.transition='opacity .3s, transform .3s'; t.style.opacity='0'; t.style.transform='translateX(10p document.getElementById('host').innerHTML=HTML;
const host=document.getElementById('host');
const now0=Date.now(), STEP=5*60000, N=288;           // 24 jam, tiap 5 menit
const rnd=(a,b)=>a+Math.random()*(b-a);
const DEV={gwt:{id:'dev-gwt',name:'nismara gwt'},flow:{id:'dev-flow',name:'Transfer Flow'},roof:{id:'dev-roof',name:'Roof Tank'},irrG:{id:'dev-g',name:'Garden Lt.1'},irrR:{id:'dev-r',name:'Garden Roof'}};
const data=[]; const ser={};
function key(dev,k){const id=dev.id+'|'+k; if(!ser[id]){ser[id]=[]; data.push({datasource:{entityId:dev.id,entityType:'DEVICE',entityName:dev.name},dataKey:{name:k},data:ser[id]});} return ser[id];}
function put(dev,k,ts,v){key(dev,k).push([ts,v]);}

/* ---- state simulasi ---- */
const S={rain:false,scn:'normal',rw:46,rwTot:12400,flowTot:48210,roof:68,pump:false,
 zones:{g1:{soil:[44,41],valve:0,auto:1,start:30,stop:55,until:0,cycles:11,run:3200,pre:'z1',dev:'irrG'},
        g2:{soil:[58,60],valve:0,auto:1,start:30,stop:55,until:0,cycles:9,run:2500,pre:'z2',dev:'irrG'},
        r1:{soil:[37,35],valve:0,auto:1,start:30,stop:55,until:0,cycles:6,run:1800,pre:'z1',dev:'irrR'}}};
const sleep=0;
function snapshot(ts,hist){
  const e=S.scn==='err';
  const t1=e?0:62+Math.sin(ts/9e5)*3, t2=e?0:60+Math.sin(ts/8e5)*3;
  put(DEV.gwt,'t1_level',ts,t1);put(DEV.gwt,'t1_vol_l',ts,t1*25);put(DEV.gwt,'t1_dist_cm',ts,e?-1:150-t1*1.3);
  put(DEV.gwt,'t2_level',ts,t2);put(DEV.gwt,'t2_vol_l',ts,t2*25);put(DEV.gwt,'t2_dist_cm',ts,e?-1:150-t2*1.3);
  put(DEV.gwt,'balance_diff',ts,Math.abs(t1-t2));put(DEV.gwt,'balance_ok',ts,true);put(DEV.gwt,'rssi',ts,S.scn==='err'?-89:-71);put(DEV.gwt,'uptime_s',ts,59937+(ts-now0)/1000);put(DEV.gwt,'heap',ts,208740);
  put(DEV.gwt,'rw_level',ts,S.rw);put(DEV.gwt,'rw_vol_l',ts,S.rw*10);put(DEV.gwt,'rw_dist_cm',ts,120-S.rw);
  const rf=S.rain?rnd(9,15):0; put(DEV.gwt,'rw_flow_lpm',ts,rf);put(DEV.gwt,'rw_total_liters',ts,S.rwTot);put(DEV.gwt,'rw_pulses_win',ts,Math.round(rf*7.5*10));
  const fl=S.pump?rnd(21,24):0; put(DEV.flow,'flow_lpm',ts,fl);put(DEV.flow,'pump_running',ts,S.pump?1:0);put(DEV.flow,'total_liters',ts,S.flowTot);put(DEV.flow,'pulses_win',ts,Math.round(fl*10));put(DEV.flow,'rssi',ts,-64);put(DEV.flow,'uptime_s',ts,120000+(ts-now0)/1000);
  put(DEV.roof,'level_pct',ts,S.roof);put(DEV.roof,'distance_cm',ts,150-S.roof);put(DEV.roof,'volume_l',ts,S.roof*90);put(DEV.roof,'pressure_bar',ts,S.pump?2.1:2.8+Math.sin(ts/3e5)*.15);
  put(DEV.roof,'pump1_status',ts,S.roof<45?1:0);put(DEV.roof,'pump2_status',ts,0);put(DEV.roof,'pump1_runtime_s',ts,5400);put(DEV.roof,'pump2_runtime_s',ts,1200);put(DEV.roof,'pump1_cycles',ts,48);put(DEV.roof,'pump2_cycles',ts,12);put(DEV.roof,'tank_count',ts,4);put(DEV.roof,'rssi',ts,-58);put(DEV.roof,'uptime_s',ts,300000+(ts-now0)/1000);
  for(const id in S.zones){const z=S.zones[id],d=DEV[z.dev],p=z.pre;
    put(d,p+'_soil1',ts,+z.soil[0].toFixed(1));put(d,p+'_soil2',ts,id==='g2'&&S.scn==='err'?-1:+z.soil[1].toFixed(1));put(d,p+'_valve',ts,z.valve);
    put(d,p+'_auto',ts,z.auto);put(d,p+'_start_pct',ts,z.start);put(d,p+'_stop_pct',ts,z.stop);
    put(d,p+'_remain_s',ts,z.until>ts?Math.round((z.until-ts)/1000):0);put(d,p+'_cycles',ts,z.cycles);put(d,p+'_runtime_s',ts,z.run);put(d,p+'_fault',ts,0);
  }
  ['irrG','irrR'].forEach(r=>{put(DEV[r],'rssi',ts,r==='irrG'?-67:-87);put(DEV[r],'in_window',ts,1);put(DEV[r],'win',ts,'05-09,16-19');put(DEV[r],'uptime_s',ts,86400+(ts-now0)/1000);put(DEV[r],'heap',ts,231000);});
}
function step(ts,dtMin){   // satu langkah simulasi
  S.rw=Math.max(5,Math.min(98,S.rw+(S.rain?0.9*dtMin/5:-0.05*dtMin/5)));
  if(S.rain){S.rwTot+=12*dtMin;}
  S.pump=S.roof<52||(S.pump&&S.roof<80); if(S.pump){S.roof+=0.7*dtMin/5;S.flowTot+=22*dtMin;} else S.roof=Math.max(20,S.roof-0.35*dtMin/5);
  for(const id in S.zones){const z=S.zones[id];
    const avg=(z.soil[0]+z.soil[1])/2;
    if(z.valve && z.until && ts>=z.until){z.valve=0;z.until=0;}
    if(z.auto && !z.until){ if(!z.valve&&avg<z.start){z.valve=1;z.cycles++;} else if(z.valve&&avg>=z.stop)z.valve=0; }
    const d=z.valve?1.6:-0.18*(S.rain&&id!=='r1'?-1.5:1)*dtMin/5; 
    z.soil=z.soil.map((v,i)=>Math.max(8,Math.min(95,v+d*dtMin/5+(i?0.02:-0.02))));
    if(z.valve)z.run+=dtMin*60;
  }
}
/* history */
{ let t=now0-N*STEP; S.rain=false; for(let i=0;i<N;i++,t+=STEP){ S.rain=(i>120&&i<150)||(i>230&&i<250); if(i%40===0){} step(t,5); snapshot(t,true); } S.rain=false; }

/* ctx + sim commands */
const ctx={$container:[host],settings:{view:'full'},data,
 attributeService:{saveEntityAttributes:(ent,scope,list)=>{
   list.forEach(a=>{const z=Object.values(S.zones).find(z=>DEV[z.dev].id===ent.id&&a.key.indexOf(z.pre+'_')===0); if(!z)return;
     const k=a.key.slice(z.pre.length+1);
     if(k==='auto'){z.auto=a.value?1:0; if(!a.value&&!z.until)z.valve=0;}
     else if(k==='start_pct')z.start=a.value; else if(k==='stop_pct')z.stop=a.value;
     else if(k==='cmd'){const[p,m]=String(a.value).split('|'); if(p==='open'){Object.values(S.zones).forEach(o=>{if(o!==z&&o.dev===z.dev){o.valve=0;o.until=0;}}); z.valve=1;z.until=Date.now()+m*60000;z.cycles++;} else {z.valve=0;z.until=0;}}
   }); tick(); return {subscribe:ok=>ok&&ok()};}}};
const self_={ctx}; new Function('self',JS)(self_); self_.onInit();
function tick(){ const ts=Date.now(); step(ts,1); snapshot(ts); self_.onDataUpdated(); }
setInterval(tick,3000); tick();
document.getElementById('rain').onclick=()=>{S.rain=!S.rain;tick();};
document.getElementById('scn').onchange=e=>{S.scn=e.target.value; if(S.scn==='dry'){Object.values(S.zones).forEach(z=>{z.soil=[24,22];z.valve=0;});} tick();};
