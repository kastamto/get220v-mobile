# Tambahkan di dalam server { ... } iot.get220v.com (sejajar location /fmea-api/, /ml-api/)
location /dash-embed/ {
    proxy_pass http://127.0.0.1:3010;   # prefix /dash-embed tetap diteruskan; service menanganinya
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # jangan log query string / body (tidak ada token di sini, tapi tetap minimal)
    access_log off;
}

# Agar dashboard TB bisa di-iframe dari domain app lain, response TB TIDAK boleh membawa
# "X-Frame-Options: DENY/SAMEORIGIN". Cek:
#   curl -sI https://iot.get220v.com/dashboard/x | grep -i -E 'x-frame|frame-ancestors'
# Bila ada, ganti dengan whitelist eksplisit di location / (proxy ke TB):
#   proxy_hide_header X-Frame-Options;
#   add_header Content-Security-Policy "frame-ancestors 'self' https://portal.rukita.co" always;
# (WebView mobile tidak terpengaruh header ini, hanya iframe di browser.)
