# Tambahkan di server { ... } iot.get220v.com, SEBELUM location / (ThingsBoard).
# Tanpa blok ini, ThingsBoard menjawab "No static resource api/siaga/v1/...".
location ^~ /api/siaga/v1/ {
    proxy_pass http://127.0.0.1:3021;      # path diteruskan apa adanya
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # IP klien asli, bukan rantai dari luar
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 32k;
    proxy_read_timeout 120s;
}
# /metrics sengaja TIDAK diteruskan: hanya bisa diakses dari server (curl 127.0.0.1:3021/metrics)
