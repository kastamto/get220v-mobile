 fill="#fff" stroke="#111827" stroke-width="1.3"/><text x="680" y="209" font-size="9" fill="#1f2937" font-weight="700" text-anchor="start">2 kΩ</text><line x1="669" y1="218" x2="669" y2="224" stroke="#111827" stroke-width="1.6"/><g stroke="#111827" stroke-width="1.6"><line x1="669" y1="224" x2="669" y2="230"/><line x1="661" y1="230" x2="677" y2="230"/><line x1="664" y1="234" x2="674" y2="234"/><line x1="667" y1="238" x2="671" y2="238"/></g><text x="778" y="179" font-size="9.5" fill="#9333ea" font-weight="700" text-anchor="end">ECHO</text><circle cx="630" cy="184" r="3" fill="#fff"/><text x="620" y="188" font-size="11.5" fill="#fff" font-weight="700" text-anchor="end">GPIO19</text><line x1="784" y1="358" x2="630" y2="358" stroke="#16a34a" stroke-width="2"/><text x="778" y="353" font-size="9.5" fill="#16a34a" font-weight="700" text-anchor="end">PULSE → interrupt</text><circle cx="630" cy="358" r="3" fill="#fff"/><text x="620" y="362" font-size="11.5" fill="#fff" font-weight="700" text-anchor="end">GPIO4</text><text x="530" y="586" font-size="10" fill="#fca5a5" font-weight="700" text-anchor="middle">VIN = +5V</text><text x="530" y="600" font-size="9" fill="#cbd5e1" font-weight="400" text-anchor="middle">GND = 0V (semua GND disatukan)</text><text x="30" y="658" font-size="13" fill="#1f2937" font-weight="700" text-anchor="start">Distribusi daya (satu catu 5V, GND disatukan)</text><line x1="60" y1="684" x2="1000" y2="684" stroke="#dc2626" stroke-width="2.4"/><text x="52" y="688" font-size="10" fill="#dc2626" font-weight="700" text-anchor="end">+5V</text><line x1="60" y1="702" x2="1000" y2="702" stroke="#111827" stroke-width="2.4"/><text x="52" y="706" font-size="10" fill="#111827" font-weight="700" text-anchor="end">GND</text><rect x="79" y="744" width="150" height="44" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/><text x="154" y="763" font-size="10.5" fill="#1f2937" font-weight="700" text-anchor="middle">Adaptor 5V 2A</text><text x="154" y="777" font-size="8.5" fill="#64748b" font-weight="400" text-anchor="middle">sumber utama</text><line x1="145" y1="684" x2="145" y2="744" stroke="#dc2626" stroke-width="1.8"/><circle cx="145" cy="684" r="3" fill="#dc2626"/><line x1="163" y1="702" x2="163" y2="744" stroke="#111827" stroke-width="1.8"/><circle cx="163" cy="702" r="3" fill="#111827"/><rect x="267" y="744" width="150" height="44" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/><text x="342" y="763" font-size="10.5" fill="#1f2937" font-weight="700" text-anchor="middle">ESP32 VIN</text><text x="342" y="777" font-size="8.5" fill="#64748b" font-weight="400" text-anchor="middle">regulator onboard → 3V3</text><line x1="333" y1="684" x2="333" y2="744" stroke="#dc2626" stroke-width="1.8"/><circle cx="333" cy="684" r="3" fill="#dc2626"/><line x1="351" y1="702" x2="351" y2="744" stroke="#111827" stroke-width="1.8"/><circle cx="351" cy="702" r="3" fill="#111827"/><rect x="455" y="744" width="150" height="44" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/><text x="530" y="763" font-size="10.5" fill="#1f2937" font-weight="700" text-anchor="middle">HC-SR04 ×3</text><text x="530" y="777" font-size="8.5" fill="#64748b" font-weight="400" text-anchor="middle">VCC 5V</text><line x1="521" y1="684" x2="521" y2="744" stroke="#dc2626" stroke-width="1.8"/><circle cx="521" cy="684" r="3" fill="#dc2626"/><line x1="539" y1="702" x2="539" y2="744" stroke="#111827" stroke-width="1.8"/><circle cx="539" cy="702" r="3" fill="#111827"/><rect x="643" y="744" width="150" height="44" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/><text x="718" y="763" font-size="10.5" fill="#1f2937" font-weight="700" text-anchor="middle">LCD 20x4 I2C</text><text x="718" y="777" font-size="8.5" fill="#64748b" font-weight="400" text-anchor="middle">VCC 5V · ±150 mA</text><line x1="709" y1="684" x2="709" y2="744" stroke="#dc2626" stroke-width="1.8"/><circle cx="709" cy="684" r="3" fill="#dc2626"/><line x1="727" y1="702" x2="727" y2="744" stroke="#111827" stroke-width="1.8"/><circle cx="727" cy="702" r="3" fill="#111827"/><rect x="831" y="744" width="150" height="44" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/><text x="906" y="763" font-size="10.5" fill="#1f2937" font-weight="700" text-anchor="middle">Flow sensor</text><text x="906" y="777" font-size="8.5" fill="#64748b" font-weight="400" text-anchor="middle">V+ 5V (cek datasheet)</text><line x1="897" y1="684" x2="897" y2="744" stroke="#dc2626" stroke-width="1.8"/><circle cx="897" cy="684" r="3" fill="#dc2626"/><line x1="915" y1="702" x2="915" y2="744" stroke="#111827" stroke-width="1.8"/><circle cx="915" cy="702" r="3" fill="#111827"/><rect x="30" y="808" width="1000" height="124" rx="8" fill="#fffbeb" stroke="#f59e0b"/><text x="46" y="830" font-size="12" fill="#92400e" font-weight="700" text-anchor="start">Catatan penting</text><text x="46" y="850" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• ECHO HC-SR04 mengeluarkan 5V → WAJIB pembagi tegangan 1 kΩ (seri) + 2 kΩ (ke GND) sebelum masuk GPIO ESP32 (hanya toleran 3.3V).</text><text x="46" y="868" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• Jarak sensor ke permukaan air minimal 20 cm (blind zone HC-SR04). dist_cm = -1 di telemetry = sensor tidak terbaca / wiring salah.</text><text x="46" y="886" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• Output flow sensor: jika open-collector, pull-up internal GPIO4 cukup. Jika outputnya 5V push-pull, tambahkan pembagi 1k/2k seperti ECHO.</text><text x="46" y="904" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• LED status memakai LED onboard GPIO2 (cepat = WiFi putus, sedang = ThingsBoard putus, lambat = normal).</text><text x="46" y="922" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• LCD 20x4 I2C wajib VCC 5V (backlight ± 100–150 mA); SDA/SCL 3,3V dari ESP32 umumnya aman. Alamat 0x27 / 0x3F — cek dengan I2C scanner; atur kontras dengan trimmer di backpack.</text></svg>