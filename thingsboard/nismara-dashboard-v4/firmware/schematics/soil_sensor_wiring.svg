<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1060" width="1060" height="1060" font-family="Arial,Helvetica,sans-serif"><rect width="1060" height="1060" fill="#fff"/><text x="530" y="30" font-size="20" fill="#1f2937" font-weight="700" text-anchor="middle">Soil Moisture Sensor — Detail Wiring</text><text x="530" y="50" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">Capacitive v1.2 (3 pin: GND · VCC · AOUT) → ESP32 ADC1 · 2 sensor per device: GPIO34 &amp; GPIO35 (Lt.1: 1 per zona · Roof: 2 sensor di zona 1)</text><text x="30" y="86" font-size="13.5" fill="#1f2937" font-weight="700" text-anchor="start">A. Sambungan ke ESP32</text><line x1="470" y1="124" x2="470" y2="382" stroke="#ea580c" stroke-width="3.2"/><text x="470" y="116" font-size="11" fill="#ea580c" font-weight="700" text-anchor="middle">+3V3</text><line x1="505" y1="140" x2="505" y2="382" stroke="#111827" stroke-width="3.2"/><text x="505" y="132" font-size="11" fill="#1f2937" font-weight="700" text-anchor="middle">GND</text><rect x="700" y="90" width="230" height="298" rx="10" fill="#0f172a"/><text x="815" y="106" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">ESP32 DevKit</text><polyline points="700,124 470,124" fill="none" stroke="#ea580c" stroke-width="2.6"/><circle cx="470" cy="124" r="3" fill="#ea580c"/><circle cx="700" cy="124" r="4" fill="#fff"/><text x="710" y="128" font-size="11" fill="#fff" font-weight="700" text-anchor="start">3V3 (pin 3V3)</text><polyline points="700,140 505,140" fill="none" stroke="#111827" stroke-width="2.6"/><circle cx="505" cy="140" r="3" fill="#111827"/><circle cx="700" cy="140" r="4" fill="#fff"/><text x="710" y="144" font-size="11" fill="#fff" font-weight="700" text-anchor="start">GND (pin GND)</text><rect x="40" y="160" width="200" height="96" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.8"/><text x="126" y="178" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">Sensor 1</text><text x="126" y="192" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">Lt.1: Zone 1  ·  Roof: Z1-S1</text><text x="232" y="216" font-size="11" fill="#1f2937" font-weight="700" text-anchor="end">VCC</text><line x1="240" y1="212" x2="254" y2="212" stroke="#dc2626" stroke-width="2.6"/><text x="232" y="230" font-size="11" fill="#1f2937" font-weight="700" text-anchor="end">AOUT</text><line x1="240" y1="226" x2="254" y2="226" stroke="#eab308" stroke-width="2.6"/><text x="232" y="244" font-size="11" fill="#1f2937" font-weight="700" text-anchor="end">GND</text><line x1="240" y1="240" x2="254" y2="240" stroke="#111827" stroke-width="2.6"/><polyline points="254,212 280,212 280,156 470,156" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round"/><circle cx="470" cy="156" r="3" fill="#dc2626"/><polyline points="254,240 340,240 340,264 505,264" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round"/><circle cx="505" cy="264" r="3" fill="#111827"/><line x1="254" y1="226" x2="700" y2="226" stroke="#eab308" stroke-width="2.6"/><circle cx="700" cy="226" r="4" fill="#fff"/><text x="712" y="230" font-size="12" fill="#fff" font-weight="700" text-anchor="start">GPIO34  (ADC1)</text><circle cx="600" cy="226" r="3" fill="#eab308"/><line x1="600" y1="226" x2="600" y2="234" stroke="#eab308" stroke-width="2"/><line x1="591" y1="234" x2="609" y2="234" stroke="#111827" stroke-width="2.2"/><line x1="591" y1="239" x2="609" y2="239" stroke="#111827" stroke-width="2.2"/><line x1="600" y1="239" x2="600" y2="246" stroke="#111827" stroke-width="1.8"/><g stroke="#111827" stroke-width="1.6"><line x1="600" y1="246" x2="600" y2="252"/><line x1="592" y1="252" x2="608" y2="252"/><line x1="595" y1="256" x2="605" y2="256"/><line x1="598" y1="260" x2="602" y2="260"/></g><text x="613" y="240" font-size="9" fill="#1f2937" font-weight="700" text-anchor="start">100 nF</text><path d="M465,226 a5,5 0 0 1 10,0" fill="#fff" stroke="#eab308" stroke-width="2.6"/><path d="M500,226 a5,5 0 0 1 10,0" fill="#fff" stroke="#eab308" stroke-width="2.6"/><rect x="40" y="282" width="200" height="96" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.8"/><text x="126" y="300" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">Sensor 2</text><text x="126" y="314" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">Lt.1: Zone 2  ·  Roof: Z1-S2</text><text x="232" y="338" font-size="11" fill="#1f2937" font-weight="700" text-anchor="end">VCC</text><line x1="240" y1="334" x2="254" y2="334" stroke="#dc2626" stroke-width="2.6"/><text x="232" y="352" font-size="11" fill="#1f2937" font-weight="700" text-anchor="end">AOUT</text><line x1="240" y1="348" x2="254" y2="348" stroke="#eab308" stroke-width="2.6"/><text x="232" y="366" font-size="11" fill="#1f2937" font-weight="700" text-anchor="end">GND</text><line x1="240" y1="362" x2="254" y2="362" stroke="#111827" stroke-width="2.6"/><polyline points="254,334 284,334 284,278 470,278" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round"/><circle cx="470" cy="278" r="3" fill="#dc2626"/><polyline points="254,362 344,362 344,386 505,386" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round"/><circle cx="505" cy="386" r="3" fill="#111827"/><line x1="254" y1="348" x2="700" y2="348" stroke="#eab308" stroke-width="2.6"/><circle cx="700" cy="348" r="4" fill="#fff"/><text x="712" y="352" font-size="12" fill="#fff" font-weight="700" text-anchor="start">GPIO35  (ADC1)</text><circle cx="600" cy="348" r="3" fill="#eab308"/><line x1="600" y1="348" x2="600" y2="356" stroke="#eab308" stroke-width="2"/><line x1="591" y1="356" x2="609" y2="356" stroke="#111827" stroke-width="2.2"/><line x1="591" y1="361" x2="609" y2="361" stroke="#111827" stroke-width="2.2"/><line x1="600" y1="361" x2="600" y2="368" stroke="#111827" stroke-width="1.8"/><g stroke="#111827" stroke-width="1.6"><line x1="600" y1="368" x2="600" y2="374"/><line x1="592" y1="374" x2="608" y2="374"/><line x1="595" y1="378" x2="605" y2="378"/><line x1="598" y1="382" x2="602" y2="382"/></g><text x="613" y="362" font-size="9" fill="#1f2937" font-weight="700" text-anchor="start">100 nF</text><path d="M465,348 a5,5 0 0 1 10,0" fill="#fff" stroke="#eab308" stroke-width="2.6"/><path d="M500,348 a5,5 0 0 1 10,0" fill="#fff" stroke="#eab308" stroke-width="2.6"/><text x="476" y="400" font-size="9" fill="#64748b" font-weight="400" text-anchor="start" font-style="italic">kabel kuning melintasi rail tanpa terhubung (hop)</text><text x="30" y="438" font-size="13.5" fill="#1f2937" font-weight="700" text-anchor="start">B. Papan sensor (capacitive v1.2)</text><text x="400" y="438" font-size="13.5" fill="#1f2937" font-weight="700" text-anchor="start">C. Pemasangan di tanah</text><text x="790" y="438" font-size="13.5" fill="#1f2937" font-weight="700" text-anchor="start">D. Kabel &amp; proteksi</text><rect x="110" y="494" width="80" height="270" rx="6" fill="#065f46" stroke="#022c22" stroke-width="2"/><rect x="118" y="624" width="64" height="130" rx="3" fill="#0f766e" opacity=".75"/><line x1="90" y1="622" x2="210" y2="622" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3"/><text x="214" y="619" font-size="10" fill="#ef4444" font-weight="700" text-anchor="start">garis batas MAX</text><text x="214" y="632" font-size="9" fill="#ef4444" font-weight="400" text-anchor="start">jangan terendam melewati garis</text><text x="150" y="714" font-size="10" fill="#a7f3d0" font-weight="400" text-anchor="middle">area probe</text><text x="150" y="727" font-size="9" fill="#a7f3d0" font-weight="400" text-anchor="middle">(masuk tanah)</text><rect x="122" y="556" width="26" height="18" fill="#111827"/><text x="135" y="569" font-size="8" fill="#9ca3af" font-weight="400" text-anchor="middle">IC</text><rect x="156" y="556" width="22" height="18" fill="#111827"/><text x="167" y="569" font-size="7" fill="#9ca3af" font-weight="400" text-anchor="middle">3.3V</text><rect x="120" y="504" width="60" height="28" rx="3" fill="#f8fafc" stroke="#334155"/><circle cx="126" cy="518" r="5" fill="#111827" stroke="#111827"/><text x="126" y="548" font-size="7.5" fill="#a7f3d0" font-weight="700" text-anchor="middle">GND</text><line x1="126" y1="504" x2="126" y2="472" stroke="#111827" stroke-width="3"/><circle cx="150" cy="518" r="5" fill="#dc2626" stroke="#111827"/><text x="150" y="548" font-size="7.5" fill="#a7f3d0" font-weight="700" text-anchor="middle">VCC</text><line x1="150" y1="504" x2="150" y2="472" stroke="#dc2626" stroke-width="3"/><circle cx="174" cy="518" r="5" fill="#eab308" stroke="#111827"/><text x="174" y="548" font-size="7.5" fill="#a7f3d0" font-weight="700" text-anchor="middle">AOUT</text><line x1="174" y1="504" x2="174" y2="472" stroke="#eab308" stroke-width="3"/><text x="150" y="464" font-size="9.5" fill="#475569" font-weight="400" text-anchor="middle">konektor 3 pin (JST PH2.0)</text><text x="30" y="794" font-size="10.5" fill="#1f2937" font-weight="700" text-anchor="start">Urutan pin PCB: GND – VCC – AOUT</text><text x="30" y="809" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">(cek silkscreen; varian lain bisa berbeda)</text><rect x="30" y="824" width="330" height="86" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="42" y="843" font-size="11" fill="#1f2937" font-weight="700" text-anchor="start">Warna kabel (standar yang disarankan)</text><line x1="44" y1="858" x2="74" y2="858" stroke="#dc2626" stroke-width="4"/><text x="84" y="862" font-size="10.5" fill="#1f2937" font-weight="400" text-anchor="start">Merah  = VCC  → +3V3 ESP32 (spek 3,3–5,5V)</text><line x1="44" y1="874" x2="74" y2="874" stroke="#111827" stroke-width="4"/><text x="84" y="878" font-size="10.5" fill="#1f2937" font-weight="400" text-anchor="start">Hitam  = GND  → GND ESP32</text><line x1="44" y1="890" x2="74" y2="890" stroke="#eab308" stroke-width="4"/><text x="84" y="894" font-size="10.5" fill="#1f2937" font-weight="400" text-anchor="start">Kuning = AOUT → GPIO ADC1 (34 / 35)</text><rect x="400" y="624" width="340" height="150" rx="6" fill="#92400e" opacity=".85"/><rect x="400" y="624" width="340" height="14" fill="#65a30d"/><text x="570" y="768" font-size="10.5" fill="#fef3c7" font-weight="700" text-anchor="middle">tanah / media tanam</text><rect x="466" y="556" width="28" height="112" rx="3" fill="#065f46" stroke="#022c22" stroke-width="1.5"/><rect x="472" y="616" width="16" height="108" fill="#0f766e" opacity=".8"/><rect x="464" y="550" width="32" height="14" rx="3" fill="#f8fafc" stroke="#334155"/><rect x="465" y="544" width="30" height="12" rx="3" fill="#1f2937"/><text x="480" y="553" font-size="7" fill="#fbbf24" font-weight="400" text-anchor="middle">heat-shrink</text><path d="M480,544 C480,520 506,520 520,508" fill="none" stroke="#111827" stroke-width="3"/><text x="480" y="750" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">Sensor 1</text><rect x="626" y="556" width="28" height="112" rx="3" fill="#065f46" stroke="#022c22" stroke-width="1.5"/><rect x="632" y="616" width="16" height="108" fill="#0f766e" opacity=".8"/><rect x="624" y="550" width="32" height="14" rx="3" fill="#f8fafc" stroke="#334155"/><rect x="625" y="544" width="30" height="12" rx="3" fill="#1f2937"/><text x="640" y="553" font-size="7" fill="#fbbf24" font-weight="400" text-anchor="middle">heat-shrink</text><path d="M640,544 C640,520 666,520 680,508" fill="none" stroke="#111827" stroke-width="3"/><text x="640" y="750" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">Sensor 2</text><text x="560" y="502" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">→ kabel ke junction box / ESP32</text><text x="560" y="520" font-size="9" fill="#92400e" font-weight="700" text-anchor="middle">drip loop:</text><text x="560" y="532" font-size="9" fill="#92400e" font-weight="400" text-anchor="middle">kabel melengkung</text><text x="560" y="544" font-size="9" fill="#92400e" font-weight="400" text-anchor="middle">ke bawah dulu</text><line x1="386" y1="638" x2="386" y2="704" stroke="#2563eb" stroke-width="1.6"/><polygon points="386,638 382,646 390,646" fill="#2563eb"/><polygon points="386,704 382,696 390,696" fill="#2563eb"/><text x="380" y="674" font-size="10" fill="#2563eb" font-weight="700" text-anchor="end">5–10 cm</text><text x="380" y="687" font-size="9" fill="#2563eb" font-weight="400" text-anchor="end">(zona akar)</text><rect x="400" y="790" width="340" height="108" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="412" y="809" font-size="11" fill="#1f2937" font-weight="700" text-anchor="start">Penempatan per zona</text><text x="412" y="827" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">• Lt.1: 1 sensor di titik representatif zona (tengah, jauh dari tetesan).</text><text x="412" y="843" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">• Roof: 2 sensor di titik berbeda (±1/3 &amp; 2/3 lebar). Jauhi tetesan langsung.</text><text x="412" y="859" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">• Tekan tanah rapat di sekeliling probe, tanpa celah udara.</text><text x="412" y="875" font-size="10" fill="#1f2937" font-weight="400" text-anchor="start">• Jangan membengkokkan/menggores PCB; masuk tegak lurus.</text><rect x="780" y="492" width="250" height="320" rx="8" fill="#fffbeb" stroke="#f59e0b"/><text x="790" y="516" font-size="11" fill="#92400e" font-weight="700" text-anchor="start">Kabel</text><text x="790" y="530" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">3-core 0,22–0,5 mm² (mis. kabel</text><text x="790" y="542" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">sensor / CCTV)</text><text x="790" y="560" font-size="11" fill="#92400e" font-weight="700" text-anchor="start">Jarak ≤ 5 m</text><text x="790" y="574" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">kabel biasa, twisted</text><text x="790" y="604" font-size="11" fill="#92400e" font-weight="700" text-anchor="start">Jarak 5–15 m</text><text x="790" y="618" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">kabel shielded; shield ke GND di sisi</text><text x="790" y="630" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">ESP32 SAJA</text><text x="790" y="648" font-size="11" fill="#92400e" font-weight="700" text-anchor="start">Sambungan</text><text x="790" y="662" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">solder + heat-shrink berperekat, atau</text><text x="790" y="674" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">terminal di junction box IP65</text><text x="790" y="692" font-size="11" fill="#92400e" font-weight="700" text-anchor="start">Segel PCB</text><text x="790" y="706" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">lem epoxy / hot-glue / cat kedap di</text><text x="790" y="718" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">konektor &amp; tepi atas PCB</text><text x="790" y="736" font-size="11" fill="#92400e" font-weight="700" text-anchor="start">Pisahkan</text><text x="790" y="750" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">jangan 1 jalur dengan kabel solenoid</text><text x="790" y="762" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">12/24V (induksi → bacaan loncat)</text><text x="790" y="780" font-size="11" fill="#92400e" font-weight="700" text-anchor="start">Kapasitor</text><text x="790" y="794" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">100 nF AOUT–GND di sisi ESP32</text><text x="790" y="806" font-size="9.5" fill="#78350f" font-weight="400" text-anchor="start">(mengurangi noise ADC)</text><rect x="30" y="934" width="1000" height="106" rx="8" fill="#fef2f2" stroke="#ef4444"/><text x="46" y="956" font-size="12" fill="#991b1b" font-weight="700" text-anchor="start">Peringatan</text><text x="46" y="976" font-size="10.8" fill="#7f1d1d" font-weight="400" text-anchor="start">• Catu 3,3 V dari pin 3V3 ESP32: aman &amp; sesuai spek (3,3–5,5 V; AOUT 0–3,0 V). Sensor tiruan bisa berbeda — ukur AOUT dengan multimeter sebelum disambung; harus ≤ 3,3 V.</text><text x="46" y="994" font-size="10.8" fill="#7f1d1d" font-weight="400" text-anchor="start">• Hanya pin ADC1 (GPIO32–39) — ADC2 tidak dapat dibaca saat WiFi aktif. GPIO34/35 input-only (aman untuk ADC).</text><text x="46" y="1012" font-size="10.8" fill="#7f1d1d" font-weight="400" text-anchor="start">• Arus 2 sensor ± 10 mA dari pin 3V3 ESP32: aman. Untuk lebih dari 6 sensor gunakan regulator 3,3V terpisah (GND disatukan).</text><text x="46" y="1030" font-size="10.8" fill="#7f1d1d" font-weight="400" text-anchor="start">• Kalibrasi: set SOIL_CAL_MODE 1 di config.h, baca raw di udara (→ SOIL_RAW_DRY) dan tercelup sampai garis MAX (→ SOIL_RAW_WET).</text></svg>