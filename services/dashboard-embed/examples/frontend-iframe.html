<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contoh embed dashboard</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1630; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <iframe id="tb" title="Dashboard Get220v" allow="fullscreen"></iframe>
  <script>
    // /my-backend/dashboard-embed = endpoint backend app Anda yang memanggil
    // getDashboardEmbedUrl() (lihat backend-node.mjs). embedUrl hanya berlaku 60 detik & sekali pakai,
    // jadi minta baru setiap kali halaman dibuka / sesi habis (sessionExpiresAt).
    async function load() {
      const r = await fetch('/my-backend/dashboard-embed?dashboardId=DASHBOARD_UUID');
      const { embedUrl, sessionExpiresAt } = await r.json();
      document.getElementById('tb').src = embedUrl;
      if (sessionExpiresAt) {
        const ms = new Date(sessionExpiresAt) - Date.now() - 60_000;
        setTimeout(load, Math.max(ms, 60_000));
      }
    }
    load();
  </script>
</body>
</html>
