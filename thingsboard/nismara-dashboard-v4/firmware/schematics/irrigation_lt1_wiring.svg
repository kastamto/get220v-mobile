><line x1="757" y1="888" x2="757" y2="916" stroke="#111827" stroke-width="1.8"/><circle cx="757" cy="916" r="3" fill="#111827"/><text x="745" y="882" font-size="9" fill="#1f2937" font-weight="700" text-anchor="end">1N4007</text><text x="745" y="894" font-size="8.5" fill="#64748b" font-weight="400" text-anchor="end">flyback</text><rect x="30" y="950" width="1000" height="124" rx="8" fill="#fffbeb" stroke="#f59e0b"/><text x="46" y="972" font-size="12" fill="#92400e" font-weight="700" text-anchor="start">Catatan penting</text><text x="46" y="992" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• Satu valve aktif sekaligus (MAX_CONCURRENT = 1) karena suplai air dipakai bersama.</text><text x="46" y="1010" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• Hanya pin ADC1 (GPIO32–39) dipakai untuk soil sensor — ADC2 tidak bisa dibaca saat WiFi aktif.</text><text x="46" y="1028" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• Dioda 1N4007 dipasang PARALEL solenoid (katoda ke sisi +12/24V) untuk meredam lonjakan saat relay lepas.</text><text x="46" y="1046" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• Modul relay active-low (umum): IN = LOW → relay ON. Atur RELAY_ACTIVE_LOW di config.h. GND logika &amp; GND 12/24V disatukan.</text><text x="46" y="1064" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• Tombol manual: tekan sekali = buka valve 5 menit, tekan lagi = tutup (pull-up internal ESP32).</text></svg>