l="#111827"/><text x="30" y="618" font-size="13" fill="#1f2937" font-weight="700" text-anchor="start">Driver solenoid (12/24V) — kontak relay &amp; dioda flyback</text><line x1="70" y1="644" x2="990" y2="644" stroke="#dc2626" stroke-width="2.6"/><text x="62" y="648" font-size="10" fill="#dc2626" font-weight="700" text-anchor="end">+12/24V</text><line x1="70" y1="794" x2="990" y2="794" stroke="#111827" stroke-width="2.6"/><text x="62" y="798" font-size="10" fill="#1f2937" font-weight="700" text-anchor="end">0V</text><line x1="490" y1="644" x2="490" y2="662" stroke="#111827" stroke-width="2"/><circle cx="490" cy="644" r="3" fill="#111827"/><circle cx="490" cy="666" r="3" fill="#fff" stroke="#111827" stroke-width="1.5"/><text x="480" y="670" font-size="9" fill="#1f2937" font-weight="400" text-anchor="end">COM</text><line x1="490" y1="664" x2="506" y2="694" stroke="#111827" stroke-width="2"/><circle cx="490" cy="706" r="3" fill="#fff" stroke="#111827" stroke-width="1.5"/><text x="480" y="710" font-size="9" fill="#1f2937" font-weight="400" text-anchor="end">NO</text><line x1="490" y1="709" x2="490" y2="724" stroke="#111827" stroke-width="2"/><rect x="458" y="658" width="64" height="58" rx="6" fill="none" stroke="#db2777" stroke-dasharray="4 3"/><text x="452" y="690" font-size="9.5" fill="#db2777" font-weight="700" text-anchor="end">Relay CH1</text><polyline points="490,724 490,740 572,740" fill="none" stroke="#111827" stroke-width="2"/><circle cx="590" cy="740" r="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="590" y="745" font-size="14" fill="#0e7490" font-weight="700" text-anchor="middle">S</text><text x="590" y="710" font-size="10.5" fill="#1f2937" font-weight="700" text-anchor="middle">Solenoid Zone 1</text><line x1="608" y1="740" x2="628" y2="740" stroke="#111827" stroke-width="2"/><line x1="628" y1="740" x2="628" y2="794" stroke="#111827" stroke-width="2"/><circle cx="628" cy="794" r="3" fill="#111827"/><circle cx="532" cy="740" r="3" fill="#111827"/><line x1="532" y1="740" x2="532" y2="750" stroke="#111827" stroke-width="1.8"/><line x1="524" y1="750" x2="540" y2="750" stroke="#111827" stroke-width="2.6"/><polygon points="524,766 540,766 532,752" fill="#111827"/><line x1="532" y1="766" x2="532" y2="794" stroke="#111827" stroke-width="1.8"/><circle cx="532" cy="794" r="3" fill="#111827"/><text x="520" y="760" font-size="9" fill="#1f2937" font-weight="700" text-anchor="end">1N4007</text><text x="520" y="772" font-size="8.5" fill="#64748b" font-weight="400" text-anchor="end">flyback</text><rect x="30" y="828" width="1000" height="106" rx="8" fill="#fffbeb" stroke="#f59e0b"/><text x="46" y="850" font-size="12" fill="#92400e" font-weight="700" text-anchor="start">Catatan penting</text><text x="46" y="870" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• Hanya pin ADC1 (GPIO32–39) dipakai untuk soil sensor — ADC2 tidak bisa dibaca saat WiFi aktif.</text><text x="46" y="888" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• Dioda 1N4007 dipasang PARALEL solenoid (katoda ke sisi +12/24V) untuk meredam lonjakan saat relay lepas.</text><text x="46" y="906" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• Modul relay active-low (umum): IN = LOW → relay ON. Atur RELAY_ACTIVE_LOW di config.h. GND logika &amp; GND 12/24V disatukan.</text><text x="46" y="924" font-size="11" fill="#78350f" font-weight="400" text-anchor="start">• Tombol manual: tekan sekali = buka valve 5 menit, tekan lagi = tutup (pull-up internal ESP32).</text></svg>