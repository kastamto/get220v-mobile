name: Build mobile (Android APK + iOS)

# Jalankan manual dari tab Actions ("Run workflow"), atau otomatis saat kode app berubah.
on:
  workflow_dispatch:
  push:
    branches: [claude/fervent-shannon-h3imwn]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-mobile.yml'

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.29.0'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # untuk rilis apk-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Konfigurasi Get220v (dart-define)
        run: cp .github/get220v-config.json configs.json

      - name: Dependencies + ikon + splash
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Terima lisensi Android SDK + pasang NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" > /dev/null

      - name: Build APK release
        run: flutter build apk --release --dart-define-from-file=configs.json

      - name: Siapkan file
        id: out
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Get220v-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Get220v-Android-${{ steps.out.outputs.version }}
          path: dist/*.apk
          retention-days: 30

      # Pre-release "apk-latest" = link unduhan tetap untuk APK terbaru (diganti setiap build)
      - name: Rilis apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create apk-latest dist/*.apk -R "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Get220v APK terbaru (${{ steps.out.outputs.version }})" \
            --notes "Build otomatis dari ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Untuk tes / sideload; ditandatangani debug key, bukan untuk Play Store."

  ios:
    name: iOS (Simulator + unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Konfigurasi Get220v (dart-define + AppConfig.xcconfig)
        run: |
          cp .github/get220v-config.json configs.json
          # AppConfig.xcconfig di-include wajib oleh Debug/Release.xcconfig (file ini di-.gitignore)
          python3 - <<'PY'
          import json, re
          cfg = json.load(open('configs.json'))
          lines = ['// dibuat oleh workflow build-mobile dari .github/get220v-config.json']
          for k, v in cfg.items():
              lines.append(re.sub(r'[^A-Z0-9_]', '_', k.upper()) + '=' + str(v))
          open('ios/Flutter/AppConfig.xcconfig', 'w').write('\n'.join(lines) + '\n')
          PY
          cat ios/Flutter/AppConfig.xcconfig

      - name: Dependencies + ikon + splash
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build untuk iPhone Simulator (tanpa akun Apple)
        run: flutter build ios --simulator --debug --dart-define-from-file=configs.json

      - name: Paket Simulator
        run: |
          mkdir -p dist
          cd build/ios/iphonesimulator && zip -qry "$GITHUB_WORKSPACE/dist/Get220v-iOS-Simulator.zip" Runner.app

      - name: Build iPhone release tanpa tanda tangan
        run: flutter build ios --release --no-codesign --dart-define-from-file=configs.json

      - name: Paket IPA (unsigned)
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/Get220v-iOS-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Get220v-iOS
          path: dist/*
          retention-days: 30
